function scanSheet(s) {
  let body = "";
  const again = `<label class="btn neutral full">${ic("photo")}<span>Use a different photo</span><input type="file" accept="image/*" id="scan-file" class="visually-hidden" data-action-change="scan-file"></label>`;
  if (s.status === "idle") {
    body += lede("cameraVF", "Snap a fridge shelf or a grocery bag.");
    body += `<div class="big-tiles"><label class="big-tile"><span class="icon-circle beet-soft" aria-hidden="true">${ic("camera")}</span><span class="t-tile-title">Take photo</span><input type="file" accept="image/*" capture="environment" id="scan-file" class="visually-hidden" data-action-change="scan-file"></label><label class="big-tile"><span class="icon-circle beet-soft" aria-hidden="true">${ic("photo")}</span><span class="t-tile-title">Choose from library</span><input type="file" accept="image/*" id="scan-file-library" class="visually-hidden" data-action-change="scan-file"></label></div>`;
    body += `<p class="footnote">Take or choose a photo of a fridge shelf or grocery bag. Claude lists the food it can see and estimates how long each item keeps.</p>`;
  }
  if (s.status === "working") {
    body += s.preview ? `<div class="photo"><img src="${s.preview}" alt="Selected photo"><span class="scanband" aria-hidden="true"></span></div>` : "";
    body += `<p class="thinking t-row-title" role="status">${ic("sparkles", "pulse c-beet")}Identifying groceries…</p>`;
  }
  if (s.error) body += errCard(s.error);
  const results = s.status === "done" && s.results && s.results.length;
  if (results) {
    const arrive = !s.resultsShown && !reducedMotion();
    s.resultsShown = true;
    body += sh(`Found ${s.results.length} items`) + `<div class="card flush list ${arrive ? "arrive" : ""}" style="--inset:100px">${s.results.map((r, i) => {
      const on = !!s.selected[i];
      const st = r.shelf_life_days > 0 ? expiryStatus(addDays(todayISO(), r.shelf_life_days), soonDays()) : expiryStatus(null, soonDays());
      const detail = [cap(r.location), r.shelf_life_days > 0 ? `keeps ~${plural(r.shelf_life_days, "day")}` : ""].filter(Boolean).join(" · ");
      const o = { name: r.name, detail, cat: guessCategory(r.category, r.name), st, loc: r.location, estimated: true };
      return `<button type="button" class="frow lead btnrow li ${on ? "" : "dim"}" style="--i:${Math.min(i, 12)}" data-action="toggle-scan" data-index="${i}" role="checkbox" aria-checked="${on}" aria-label="${esc((on ? "Add " : "Don't add ") + r.name + ", " + detail)}">${checkMark(on)}${foodRowInner(o)}</button>`;
    }).join("")}</div>`;

  if (s.status === "done") body += again;
  const count = s.results ? s.selected.filter(Boolean).length : 0;
  return sheetFrame("Photo of groceries", body, { bar: results ? btn(`Add ${count} to Fridge`, { icon: "fridgeFill", action: "add-scanned", full: true, disabled: !count }) : "" });
}

function receiptSheet(s) {
  const many = maxImages > 1;
  const pickLabel = s.status === "review" ? "Scan a different receipt" : many ? "Take or choose receipt photos" : "Take or choose receipt photo";
  const input = `<input type="file" accept="image/*" ${many ? "multiple" : ""} id="receipt-file" class="visually-hidden" data-action-change="receipt-file">`;
  const tip = (icon, text) => `<div class="tip"><span class="tt" aria-hidden="true">${ic(icon)}</span><span>${esc(text)}</span></div>`;
  let body = "";
  if (s.status === "idle") {
    body += lede("receipt", "Add a whole shop at once. Expiry dates are estimated from the day you shopped.");
    body += `<label class="btn primary full">${ic("camera")}<span>${pickLabel}</span>${input}</label>`;
    body += `<div class="tips">${tip("sun", "Lay it flat in good light")}${many ? tip("docs", `Long receipt? Capture it top to bottom in pages, up to ${Math.min(maxImages, 5)}`) : ""}${tip("sparkles", "Photos are sent to Claude to read the items")}</div>`;
  }
  if (s.status === "reading") {
    const rot = [-1, 2, -3];
    const thumbs = (s.previews && s.previews.length ? s.previews.slice(0, 3) : [""]).map((src, i) => src
      ? `<img src="${src}" alt="" style="transform:rotate(${rot[i]}deg);z-index:${3 - i}">`
      : `<span class="ph" style="transform:rotate(${rot[i]}deg);z-index:${3 - i}"></span>`).join("");
    body += `<div class="hstack" style="gap:20px;padding:12px 4px"><div class="receipt-thumbs" aria-hidden="true">${thumbs}<span class="scanband"></span></div><p class="vstack t-row-title" role="status" style="gap:8px"><span class="c-beet" style="font-size:1.6rem">${ic("receipt", "pulse")}</span>Reading ${s.pageCount > 1 ? s.pageCount + " pages" : "receipt"}…</p></div>`;
  }
  if (s.error) body += errCard(s.error);
  if (s.status === "review") {
    const inc = s.items.filter(x => x.include);
    const spent = inc.reduce((a, x) => a + (x.price || 0), 0);
    const est = freshCounts(inc.map(x => ({ st: expiryStatus(receiptExpiry(x, s.purchased), soonDays()), loc: x.location })));
    body += `<section class="card vstack">
      <h2 class="t-section">${esc(s.store || "Your receipt")}</h2>
      <div class="field" style="padding:0;min-height:44px"><label for="rc-date">Purchased</label><input id="rc-date" type="date" max="${todayISO()}" value="${s.purchased}" data-sheet-change="purchased"></div>
      <div class="figures"><div><span class="t-display-number">${inc.length}</span><span class="t-footnote c-2">items</span></div>${spent ? `<div><span class="t-display-number">$${spent.toFixed(2)}</span><span class="t-footnote c-2">spent</span></div>` : ""}</div>
      ${freshStrip(est, { headline: false, legend: false, mini: true })}
      <p class="t-footnote c-3">Expiry dates are estimated from the purchase date. Tap an item to leave it out.</p>
    </section>`;
    const arrive = !s.reviewShown && !reducedMotion();
    s.reviewShown = true;
    let order = 0;
    for (const loc of LOCATIONS) {
      const idx = s.items.map((it, i) => i).filter(i => s.items[i].location === loc);
      if (!idx.length) continue;
      body += sh(cap(loc), { count: idx.length, icon: LOC_GLYPH[loc] }) + `<div class="card flush list ${arrive ? "arrive" : ""}" style="--inset:100px">${idx.map(i => {
        const it = s.items[i];
        const detail = [fmtQty(it.quantity, it.unit), it.price ? "$" + it.price.toFixed(2) : ""].filter(Boolean).join(" · ");
        const o = { name: it.name, detail, cat: guessCategory(it.category, it.name), st: expiryStatus(receiptExpiry(it, s.purchased), soonDays()), loc: it.location, estimated: true, rawText: it.rawText };
        return `<button type="button" class="frow lead btnrow li ${it.include ? "" : "dim"}" style="--i:${Math.min(order++, 12)}" data-action="toggle-receipt" data-index="${i}" role="checkbox" aria-checked="${!!it.include}" aria-label="${esc((it.include ? "Add " : "Don't add ") + it.name + (detail ? ", " + detail : ""))}">${checkMark(it.include)}${foodRowInner(o)}</button>`;
      }).join("")}</div>`;
    }
    const covered = receiptCoveredShopping(s);
    if (covered.length) {
      body += `<section class="card vstack" style="gap:8px"><button type="button" class="toggle-row" data-action="toggle-receipt-shop" role="switch" aria-checked="${!!s.checkOff}"><span class="lede-tile" aria-hidden="true">${ic("basket")}</span><span class="grow">Check off ${plural(covered.length, "item")} on your shopping list</span><span class="switch ${s.checkOff ? "on" : ""}" aria-hidden="true"></span></button><p class="t-footnote c-2">${esc(covered.map(x => x.name).join(", "))}</p></section>`;
    }
    if (s.skipped.length) {
      body += `<details class="card skipped" style="padding:2px 16px" data-sheet-open="skippedOpen" ${s.skippedOpen ? "open" : ""}><summary><span>Skipped ${s.skipped.length} non-food line${s.skipped.length === 1 ? "" : "s"}</span>${ic("right")}</summary><div class="lines">${s.skipped.map(l => `<span class="t-mono c-2">${esc(l)}</span>`).join("")}</div></details>`;
    }
    body += `<label class="btn neutral full">${ic("receipt")}<span>${pickLabel}</span>${input}</label>`;
  }
  const count = s.status === "review" ? s.items.filter(x => x.include).length : 0;
  return sheetFrame("Scan receipt", body, { bar: s.status === "review" ? btn(`Add ${count} to Fridge`, { icon: "fridgeFill", action: "add-receipt", full: true, disabled: !count }) : "" });
}
function receiptCoveredShopping(s) {
  const bought = s.items.filter(x => x.include).map(x => x.name);
  return state.shopping.filter(x => !x.checked && bought.some(b => namesMatch(b, x.name)));
}

function cookSheet(s) {
  const r = recipeById(s.recipeId);
  if (!r) return sheetFrame("Update your fridge", "");
  const ds = cookDeductions(r, s.servings / Math.max(r.servings || 1, 1), state.pantry, staples());
  let body = lede("pan", r.title);
  body += `<section class="card vstack"><div class="hstack" style="justify-content:space-between"><span class="t-row-title">Made</span>${stepper(s.servings, s.servings === 1 ? "serving" : "servings", "cook-servings")}</div>${s.servings !== r.servings ? `<p class="t-footnote c-3">The recipe serves ${r.servings}; amounts are scaled.</p>` : ""}</section>`;
  let willRemove = 0;
  if (!ds.length) {
    body += `<section class="card"><p class="t-detail c-2">Nothing in your fridge matched this recipe's ingredients, so there's nothing to update.</p></section>`;
  } else {
    const rows = ds.map(d => {
      const item = state.pantry[d.index];
      const on = !s.skipped[d.id];
      const had = fmtQty(item.quantity, item.unit);
      if (on && (d.change === "remove" || (d.change === "unknown" && s.usedUp[d.id]))) willRemove++;
      let change;
      if (!on) change = `<span class="t-detail c-2">Unchanged</span>`;
      else if (d.change === "reduce") {
        const now = fmtQty(d.left, item.unit) || "0";
        const pct = item.quantity > 0 ? Math.max(0, Math.min(100, d.left / item.quantity * 100)) : 0;
        change = `<span class="pen" role="img" aria-label="${esc(`${had || "?"}, becomes ${now}`)}"><s class="t-number">${esc(had || "?")}</s><span class="arrow">${ic("arrowRight")}</span><span class="t-number">${esc(now)}</span></span><span class="lvl" aria-hidden="true"><i style="width:${pct.toFixed(0)}%"></i></span>`;
      } else if (d.change === "remove") {
        change = `<span class="hstack" style="gap:8px">${sticker("Used up", { icon: "check", iconColor: "var(--fresh)" })}${had ? `<span class="t-detail c-2">had ${esc(had)}</span>` : ""}</span>`;
      } else {
        change = `<span class="t-detail c-2">Recipe uses ${esc(d.neededText || "some")}${had ? ` · you have ${esc(had)}` : ""}</span>` +
          chipGroup("Anything left?", [["some", "Some left"], ["used", "Used it all"]].map(([v, l]) => chip(l, { action: "cook-left", id: d.id, value: v, pressed: (v === "used") === !!s.usedUp[d.id] })).join(""), "inset0");
      }
      return `<div class="cook-row li ${on ? "" : "off"}"><button type="button" class="check ${on ? "on" : ""}" data-action="cook-toggle" data-id="${esc(d.id)}" role="checkbox" aria-checked="${on}" aria-label="Update ${esc(item.name)}">${ic(on ? "checkFill" : "circle")}</button><span style="padding-top:2px">${tile(itemCat(item))}</span><div class="body"><span class="t-row-title">${esc(item.name)}</span>${change}</div></div>`;
    }).join("");

    const bar = `${btn("Still have it", { icon: "check", action: "ci-answer", value: "kept", full: true })}<div class="row2">${btn("Used it", { kind: "neutral", icon: "fork", action: "ci-answer", value: "used", full: true })}${btn("Tossed it", { kind: "danger", icon: "trash", action: "ci-answer", value: "tossed", full: true })}</div><div class="hstack" style="justify-content:space-between;margin:-4px -4px -6px">${quiet("Undo", { icon: "undo", action: "ci-undo", disabled: !s.pos })}${quiet("Skip", { icon: "skip", iconAfter: true, action: "ci-skip" })}</div>`;

  const kept = by("kept"), used = by("used"), tossed = by("tossed");

  const mUsed = recent.filter(e => e.kind === "used").length + used.length;

  const mValue = recent.filter(e => e.kind === "tossed").reduce((a, e) => a + (e.value || 0), 0) + tossedValue;
  const rate = mUsed + mTossed ? Math.round(mTossed / (mUsed + mTossed) * 100) : null;

  const gone = [...used, ...tossed];
  if (gone.length) {

    body += sh("Buy again?", { count: gone.length }) + `<div class="card flush list">${gone.map(it => {

  return sheetFrame("Weekly check-in", body, { left: close, bar: dialog ? "" : btn("Save check-in", { icon: "check", action: "save-checkin", full: true }), dialog });

function ingredientLine(i) {
  return [fmtQty(i.quantity, i.unit), i.name].filter(Boolean).join(" ") + (i.note ? `, ${i.note}` : "") + (i.isOptional ? " (optional)" : "");
}
const UNITS = ["cups", "cup", "tbsp", "tsp", "g", "kg", "oz", "lb", "lbs", "ml", "l", "slices", "slice", "cloves", "clove", "cans", "can", "pinch", "bunch", "bag", "head", "stalks", "sprigs", "pieces", "piece", "quarts", "pints"];
function parseQuantity(s) {
  const map = { "¼": 0.25, "½": 0.5, "¾": 0.75, "⅓": 0.33, "⅔": 0.67 };
  let total = 0;
  for (const part of s.split(/\s+/)) {
    if (!part) continue;
    const m = part.match(/^(\d+(?:\.\d+)?)?([¼½¾⅓⅔])?$/);
    if (m && (m[1] || m[2])) { total += (m[1] ? parseFloat(m[1]) : 0) + (m[2] ? map[m[2]] : 0); continue; }
    const f = part.match(/^(\d+)\/(\d+)$/);
    if (f) { total += Number(f[1]) / Number(f[2]); continue; }
    return null;
  }
  return total;
}
function parseIngredientLine(line) {
  let text = line.trim();
  if (!text) return null;
  let isOptional = false;
  if (/\(optional\)\s*$/i.test(text)) { isOptional = true; text = text.replace(/\(optional\)\s*$/i, "").trim(); }
  let note = "";
  const comma = text.indexOf(",");
  if (comma > 0) { note = text.slice(comma + 1).trim(); text = text.slice(0, comma).trim(); }
  const words = text.split(/\s+/);
  let quantity = 0, i = 0;
  while (i < words.length && parseQuantity(words.slice(0, i + 1).join(" ")) !== null) i++;
  if (i > 0) quantity = parseQuantity(words.slice(0, i).join(" "));
  let unit = "";
  if (i < words.length - 1 && UNITS.includes(words[i].toLowerCase())) { unit = words[i]; i++; }
  const name = words.slice(i).join(" ") || text;
  return { name, quantity, unit, note, isOptional };
}

async function runChat(text) {
  const msg = text.trim();
  if (!msg || ui.chatBusy || !sample) return;
  ui.chat.push({ role: "user", content: msg });
  ui.chatDraft = "";
  ui.chatBusy = true; ui.chatStreaming = ""; ui.chatError = "";
  const ctl = new AbortController();
  ui.chatCtl = ctl;
  render();
  scrollToEnd();
  const turns = [{ role: "user", content: CHEF_RULES + "\n\n" + kitchenContext() }, ...ui.chat.slice(-12)];
  try {
    const { text: reply } = await sample(turns, {
      cache: false,
      signal: ctl.signal,
      onText: ({ text }) => {
        ui.chatStreaming = text;
        const el = document.getElementById("streaming");
        if (el) el.innerHTML = md(text);
      },
    });
    ui.chat.push({ role: "assistant", content: reply });
  } catch (e) {
    if (e && e.text && e.code !== "refused") ui.chat.push({ role: "assistant", content: e.text });
    else if (ui.chat.length && ui.chat[ui.chat.length - 1].role === "user") ui.chatDraft = ui.chat.pop().content;
    ui.chatError = copyFor(e);
  } finally {
    ui.chatBusy = false; ui.chatStreaming = ""; ui.chatCtl = null;
    render();
    scrollToEnd();
  }
}
function scrollToEnd() { window.scrollTo({ top: document.body.scrollHeight }); }

      location: LOCATIONS.includes(x.location) ? x.location : "fridge", shelf_life_days: Math.max(0, parseInt(x.shelf_life_days, 10) || 0),
    }));
    s.status = "done"; s.results = list; s.selected = list.map(() => true);
    if (!list.length) s.error = "No groceries recognized. Try a closer, well-lit photo.";
  } catch (e) {
    if (ui.sheet !== s) return;
    s.status = "done"; s.error = copyFor(e) || "Scan stopped.";
  }
  renderSheet();
}

async function runReceipt(fileList) {
  const s = ui.sheet;
  const files = [...(fileList || [])].slice(0, Math.min(maxImages, 5));
  if (!files.length) return;
  s.status = "reading"; s.error = ""; s.pageCount = files.length; s.reviewShown = false;
  s.previews = files.slice(0, 3).map(f => { try { return URL.createObjectURL(f); } catch (e) { return ""; } }).filter(Boolean);
  renderSheet();
  const pages = files.length > 1 ? `These ${files.length} images are consecutive parts of one receipt, top to bottom; don't list an item twice where the photos overlap. ` : "";
  try {
    const scan = await sample.json(`${pages}You read grocery store receipts for a kitchen inventory app. Today is ${todayISO()}. Return one entry per purchased product line, in the order printed. Receipts use heavy abbreviations (e.g. "ORG BNLS SKNLS CHKN BRST" is chicken breast, "GRN ONION" is green onions, "HNY CRSP APPL" is Honeycrisp apples); expand them into the plain grocery name a person would say, without brand or package size. Take quantities and weights from the line or the line under it ("2 @ 1.99", "1.37 lb @ 3.49/lb"). Skip subtotals, totals, tax, payment, savings and coupon lines. Keep non-food products (paper towels, soap, bags, deposits) but mark them is_food false. If a line is unreadable, skip it rather than guess.

Reply with only a JSON object: {"store": string (empty if not shown), "purchase_date": "YYYY-MM-DD" or "" if not legible, "items": [{"raw_text": string (line as printed), "name": string, "quantity": number, "unit": string (lb, oz, gal, dozen; empty for countable items), "price": number (line total, 0 if not shown), "category": string (produce, dairy, meat, seafood, bakery, frozen, grains, snacks, beverages, condiments, household...), "location": "fridge" | "freezer" | "pantry", "shelf_life_days": integer (typical days from purchase until it spoils at that location; 0 if it effectively never does), "is_food": boolean}]}`, { images: files, cache: false });
    if (ui.sheet !== s) return;
    const lines = Array.isArray(scan && scan.items) ? scan.items : [];
    const items = receiptItems(lines);
    if (!items.length) {
      s.status = "idle"; s.error = "No food items found on that receipt. Try a sharper photo with the whole receipt in frame.";
    } else {
      s.status = "review"; s.items = items; s.checkOff = true;
      s.store = String((scan && scan.store) || "");
      s.purchased = receiptPurchaseDate(scan && scan.purchase_date);
      s.skipped = lines.filter(l => l && l.is_food === false).map(l => String(l.raw_text || l.name || "")).filter(Boolean);
    }
  } catch (e) {
    if (ui.sheet !== s) return;
    s.status = s.items && s.items.length ? "review" : "idle";
    s.error = copyFor(e) || "Scan stopped.";
  }
  renderSheet();
}

    const s = ui.sheet;
    if (!s) return;
    if (s.type === "import" && s.working) return;
    if (s.type === "checkin") {
      if (s.confirmClose) { s.confirmClose = false; renderSheet(); return; }
      if (Object.keys(s.answers || {}).length && !s.saved) { s.confirmClose = true; renderSheet(); return; }
    }
    closeSheet();
  },
};

const submits = {
  "save-item": () => {
    const name = document.getElementById("f-name").value.trim();
    if (!name) { document.getElementById("f-name").focus(); return; }
    const s = ui.sheet;
    const target = s.id ? state.pantry.find(p => p.id === s.id) : { id: uid(), addedAt: todayISO() };
    Object.assign(target, {
      name,
      quantity: parseFloat(document.getElementById("f-qty").value.replace(",", ".")) || 0,
      unit: document.getElementById("f-unit").value.trim(),
      location: document.getElementById("f-loc").value,
      category: document.getElementById("f-cat").value.trim(),
      expiresAt: document.getElementById("f-hasexp").checked ? (document.getElementById("f-exp").value || null) : null,
      notes: document.getElementById("f-notes").value,
    });
    if (!s.id) state.pantry.push(target);
    save(); closeSheet(); render();
  },
  "save-recipe": () => {
    const title = document.getElementById("r-title").value.trim();
    if (!title) { document.getElementById("r-title").focus(); return; }
    const s = ui.sheet;
    const target = s.id ? recipeById(s.id) : { id: uid(), isFavorite: false, cookCount: 0 };
    Object.assign(target, {
      title,
      summary: document.getElementById("r-summary").value.trim(),
      cuisine: document.getElementById("r-cuisine").value.trim(),
      servings: Math.max(1, parseInt(document.getElementById("r-servings").value, 10) || 1),
      prepMinutes: Math.max(0, parseInt(document.getElementById("r-prep").value, 10) || 0),
      cookMinutes: Math.max(0, parseInt(document.getElementById("r-cook").value, 10) || 0),
      tags: document.getElementById("r-tags").value.split(",").map(t => t.trim()).filter(Boolean),
      ingredients: document.getElementById("r-ings").value.split("\n").map(parseIngredientLine).filter(Boolean),
      instructions: document.getElementById("r-steps").value.split("\n").map(l => l.trim()).filter(Boolean),
    });
    if (!s.id) state.recipes.push(target);
    save(); closeSheet(); ui.tab = "recipes"; ui.recipeId = target.id; render();
  },
  "run-import": () => {
    const text = document.getElementById("imp-text").value.trim();
    if (text && !ui.sheet.working) runImport(text);
  },
  "save-plan": () => {
    const s = ui.sheet;
    const r = recipeById(s.recipeId); if (!r) return;
    const day = document.getElementById("p-day").value || todayISO();
    state.plan.push({ id: uid(), day, slot: document.getElementById("p-slot").value || "dinner", recipeId: r.id, servings: Math.max(1, parseInt(document.getElementById("p-servings").value, 10) || r.servings) });
    save(); closeSheet(); render(); toast("Added to your meal plan");
  },
  "save-settings": () => {
    state.settings.soonDays = Math.min(14, Math.max(1, parseInt(document.getElementById("s-soon").value, 10) || 3));
    state.settings.staples = document.getElementById("s-staples").value;
    save(); closeSheet(); render();
  },
  "shop-add": () => {
    const name = ui.shopDraft.trim();
    if (!name) return;
    state.shopping.push({ id: uid(), name, quantity: 0, unit: "", checked: false, reason: "" });
    ui.shopDraft = ""; save(); render();
    const f = document.getElementById("shop-new"); if (f) f.focus();
  },
  "chat-send": () => runChat(ui.chatDraft),
};

// Live previews inside open sheets (no re-render, so typing is never interrupted).
const live = {
  item: () => refreshItemSheet(),
  recipe: () => {
    const t = document.getElementById("r-total");
    if (t) t.textContent = `Total ${(parseInt(valOf("r-prep"), 10) || 0) + (parseInt(valOf("r-cook"), 10) || 0)} min`;
    const p = document.getElementById("r-tag-preview");
    if (p) p.innerHTML = tagCapsules(valOf("r-tags").split(",").map(x => x.trim()).filter(Boolean));
  },
  staples: () => {
    const p = document.getElementById("staples-preview");
    if (p) p.innerHTML = tagCapsules(valOf("s-staples").split(",").map(x => x.trim()).filter(Boolean));
  },
  import: el => {
    if (ui.sheet && ui.sheet.type === "import") ui.sheet.text = el.value;
    const go = document.getElementById("import-go"); if (go) go.disabled = !el.value.trim();
  },
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (!el || el.tagName === "FORM") return;
  if (el.classList.contains("sheet-backdrop") && ev.target !== el) return;
  if (el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener("submit", ev => {
  const form = ev.target.closest("form[data-action]");
  if (!form) return;
  ev.preventDefault();
  const fn = submits[form.dataset.action];
  if (fn) fn(form);
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.live && live[el.dataset.live]) { live[el.dataset.live](el); return; }
  if (el.dataset.bind) {
    ui[el.dataset.bind] = el.value;
    if (el.dataset.bind === "chatDraft") {
      const b = document.querySelector('.composer button[type="submit"]');
      if (b) b.disabled = !el.value.trim();
      el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 132) + "px";
    } else if (el.dataset.bind === "shopDraft") {
      const g = document.getElementById("shop-guess");
      const c = guessCategory("", el.value);
      if (g) g.innerHTML = el.value.trim() && c !== "other" ? tile(c, "s") : "";
    } else {
      render();
    }
  } else if (el.dataset.sheetBind && ui.sheet) {
    ui.sheet[el.dataset.sheetBind] = el.value;
    const pos = el.selectionStart;
    renderSheet();
    const again = document.getElementById(el.id);
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.actionChange === "toggle-exp") {
    const block = document.getElementById("exp-block");
    if (block) block.hidden = !el.checked;
    if (el.checked) refreshItemSheet();
  } else if (el.dataset.actionChange === "scan-file") {
    runScan(el.files && el.files[0]);
  } else if (el.dataset.actionChange === "receipt-file") {
    runReceipt(el.files);
  } else if (el.dataset.live && live[el.dataset.live]) {
    live[el.dataset.live](el);
  } else if (el.dataset.sheetChange && ui.sheet) {
    if (el.value) { ui.sheet[el.dataset.sheetChange] = el.value; renderSheet(); }
  }
});
document.addEventListener("toggle", ev => {
  const el = ev.target;
  if (el && el.dataset && el.dataset.sheetOpen && ui.sheet) ui.sheet[el.dataset.sheetOpen] = el.open;
}, true);
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.sheet) actions["close-sheet"]();
  if (ev.key === "Enter" && !ev.shiftKey && ev.target.id === "chat-input" && !ev.isComposing) {
    ev.preventDefault();
    if (!ui.chatBusy) runChat(ui.chatDraft);
  }
});

render();
})();
</script>
