<title>Fridge Preview</title>

<script>
(() => {
"use strict";

// ---------- Sample data (from the iOS app's SampleRecipes.json) ----------
const SAMPLE_RECIPES = __RECIPES__;

// ---------- FridgeCore port ----------
const DESCRIPTORS = new Set(["fresh","freshly","large","small","medium","chopped","diced","minced","sliced","grated","shredded","ground","whole","ripe","raw","cooked","boneless","skinless","organic","frozen","dried","canned","extra","virgin","finely","roughly","thinly","softened","melted","room","temperature","optional","to","taste","of","a","an","the","and"]);
const SINGULAR_EXCEPTIONS = new Set(["hummus","couscous","asparagus","molasses","swiss","citrus","grass","bass","watercress","anise","series","cheese","lettuce","rice"]);
const DEFAULT_STAPLES = "salt, black pepper, pepper, water, olive oil, vegetable oil, oil";

function singularize(w) {
  if (w.length <= 3 || SINGULAR_EXCEPTIONS.has(w)) return w;
  if (w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.endsWith("oes")) return w.slice(0, -2);
  if (/(ches|shes|xes)$/.test(w)) return w.slice(0, -2);
  if (w.endsWith("ss") || w.endsWith("us")) return w;
  if (w.endsWith("s")) return w.slice(0, -1);
  return w;
}
function tokens(raw) {
  const head = String(raw || "").toLowerCase().split(/[,(]/)[0];
  return head.split(/[^a-zÀ-ɏ]+/).filter(Boolean).filter(w => !DESCRIPTORS.has(w)).map(singularize);
}
const normalize = raw => tokens(raw).join(" ");
// Last words that make a different product ("chicken broth" isn't chicken), and
// two-word products that never equal either word alone.
const PRODUCT_HEADS = new Set(["broth", "stock", "bouillon", "powder", "paste", "sauce", "vinegar", "oil", "lettuce", "extract", "flake", "seasoning", "syrup", "chip", "jam", "jelly", "soup"]);
const DISTINCT_COMPOUNDS = [["coconut", "milk"], ["almond", "milk"], ["oat", "milk"], ["soy", "milk"], ["rice", "milk"], ["peanut", "butter"], ["almond", "butter"], ["apple", "butter"], ["cream", "cheese"], ["sour", "cream"], ["ice", "cream"], ["coconut", "cream"], ["baking", "soda"], ["baking", "powder"], ["green", "onion"], ["sweet", "potato"]];
function namesMatch(a, b) {
  const wa = tokens(a), wb = tokens(b);
  const ta = new Set(wa), tb = new Set(wb);
  if (!ta.size || !tb.size) return false;
  const subset = (x, y) => [...x].every(t => y.has(t));
  if (!subset(ta, tb) && !subset(tb, ta)) return false;
  if (ta.size === tb.size) return true;
  const [shorter, longerWords] = ta.size < tb.size ? [ta, wb] : [tb, wa];
  const head = longerWords[longerWords.length - 1];
  if (PRODUCT_HEADS.has(head) && !shorter.has(head)) return false;
  for (const c of DISTINCT_COMPOUNDS) {
    if (c.every(t => ta.has(t)) !== c.every(t => tb.has(t))) return false;
  }
  return true;
}

function todayISO() { return toISO(new Date()); }
function toISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fromISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n) { const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function daysBetween(a, b) { return Math.round((fromISO(b) - fromISO(a)) / 86400000); }

function expiryStatus(expiresAt, soonDays) {
  if (!expiresAt) return { kind: "unknown", days: 0, urgency: Infinity, label: "No date" };
  const d = daysBetween(todayISO(), expiresAt);
  if (d < 0) {
    const ago = -d;
    return { kind: "expired", days: ago, urgency: -1000 - ago, label: ago === 1 ? "Expired yesterday" : `Expired ${ago}d ago` };
  }
  const kind = d <= soonDays ? "soon" : "fresh";
  const label = d === 0 ? "Expires today" : d === 1 && kind === "soon" ? "Expires tomorrow" : `${d}d left`;
  return { kind, days: d, urgency: d, label };
}
const isUrgent = s => s.kind === "expired" || s.kind === "soon";

function matchRecipe(recipe, pantry, staples, soonDays) {
  const have = [], missing = [];
  let expiring = 0;
  const stapleKeys = new Set(staples.map(normalize));
  for (const ing of recipe.ingredients) {
    if (ing.isOptional) continue;
    if (stapleKeys.has(normalize(ing.name))) { have.push(ing.name); continue; }
    const hits = pantry.filter(p => namesMatch(p.name, ing.name));
    if (!hits.length) { missing.push(ing.name); continue; }
    have.push(ing.name);
    if (hits.some(p => isUrgent(expiryStatus(p.expiresAt, soonDays)))) expiring++;
  }
  const required = have.length + missing.length;
  return { have, missing, expiring, required, coverage: required ? have.length / required : 1, canMake: missing.length === 0 };
}
function isBetter(a, b) {
  if (a.canMake !== b.canMake) return a.canMake;
  if (a.expiring !== b.expiring) return a.expiring > b.expiring;
  if (a.coverage !== b.coverage) return a.coverage > b.coverage;
  return a.missing.length < b.missing.length;
}

function buildShopping(planned, pantry, listedNames, staples) {
  const stapleKeys = new Set(staples.map(normalize));
  const listed = listedNames.map(normalize);
  const order = [], totals = new Map();
  for (const r of planned) {
    for (const ing of r.ingredients) {
      if (ing.isOptional) continue;
      const n = normalize(ing.name);
      if (!n || stapleKeys.has(n)) continue;
      const key = n + "|" + (ing.unit || "").toLowerCase();
      const t = totals.get(key);
      if (t) {
        t.quantity += (ing.quantity || 0) * r.scale;
        if (!t.forRecipes.includes(r.title)) t.forRecipes.push(r.title);
      } else {
        order.push(key);
        totals.set(key, { key: n, unitKey: (ing.unit || "").toLowerCase(), name: ing.name, quantity: (ing.quantity || 0) * r.scale, unit: ing.unit || "", forRecipes: [r.title] });
      }
    }
  }
  const out = [];
  for (const key of order) {
    const item = totals.get(key);
    if (listed.some(l => namesMatch(l, item.key))) continue;
    const stocked = pantry.filter(p => namesMatch(p.name, item.key));
    if (!stocked.length) { out.push(item); continue; }
    const same = stocked.filter(p => (p.unit || "").toLowerCase() === item.unitKey);
    if (!same.length || item.quantity <= 0) continue;
    item.quantity -= same.reduce((s, p) => s + (p.quantity || 0), 0);
    if (item.quantity > 0.0001) out.push(item);
  }
  return out;
}

// KitchenUnit + CookPlanner port: what cooking a recipe uses from the pantry.
const UNIT_TABLE = { tsp: ["v", 4.929], tbsp: ["v", 14.787], cup: ["v", 236.6], "fl oz": ["v", 29.57], ml: ["v", 1], l: ["v", 1000], pint: ["v", 473.2], quart: ["v", 946.4], gal: ["v", 3785.4], g: ["w", 1], kg: ["w", 1000], oz: ["w", 28.35], lb: ["w", 453.6], "": ["c", 1], dozen: ["c", 12] };
const UNIT_ALIASES = { teaspoon: "tsp", t: "tsp", tablespoon: "tbsp", tbs: "tbsp", tbl: "tbsp", c: "cup", "fluid ounce": "fl oz", floz: "fl oz", milliliter: "ml", millilitre: "ml", liter: "l", litre: "l", pt: "pint", qt: "quart", gallon: "gal", gram: "g", gm: "g", kilogram: "kg", kilo: "kg", ounce: "oz", pound: "lb", piece: "", pc: "", each: "", ea: "", ct: "", count: "", whole: "", item: "", doz: "dozen" };
function canonicalUnit(raw) {
  let u = String(raw || "").toLowerCase().trim().replace(/\.+$/, "");
  const cands = [u];
  if (u.length > 1 && u.endsWith("s") && !u.endsWith("ss")) cands.push(u.slice(0, -1));
  for (const c of cands) {
    if (c in UNIT_ALIASES) return UNIT_ALIASES[c];
    if (c in UNIT_TABLE) return c;
  }
  return cands[cands.length - 1];
}
// Grams per US cup for staples bought by weight but measured by volume (longest names first).
const GRAMS_PER_CUP = [["powdered sugar", 120], ["brown sugar", 220], ["bread flour", 127], ["cocoa powder", 85], ["peanut butter", 258], ["parmesan cheese", 100], ["cheddar cheese", 113], ["butter", 227], ["flour", 125], ["sugar", 200], ["rice", 185], ["oat", 90], ["honey", 340], ["cocoa", 85], ["quinoa", 170], ["lentil", 190]];
function gramsPerCup(ingredient) {
  const have = new Set(tokens(ingredient));
  const hit = GRAMS_PER_CUP.find(([k]) => tokens(k).every(t => have.has(t)));
  return hit ? hit[1] : null;
}
function convertUnit(q, from, to, ingredient) {
  const a = canonicalUnit(from), b = canonicalUnit(to);
  if (a === b) return q;
  const ta = UNIT_TABLE[a], tb = UNIT_TABLE[b];
  if (!ta || !tb) return null;
  if (ta[0] === tb[0]) return q * ta[1] / tb[1];
  const density = ingredient ? gramsPerCup(ingredient) : null;
  if (!density) return null;
  const gPerMl = density / 236.6;
  if (ta[0] === "v" && tb[0] === "w") return q * ta[1] * gPerMl / tb[1];
  if (ta[0] === "w" && tb[0] === "v") return q * ta[1] / gPerMl / tb[1];
  return null;
}
function cookDeductions(recipe, scale, pantry, staplesList) {
  const stapleKeys = new Set(staplesList.map(normalize));
  const remaining = pantry.map(p => Number(p.quantity) || 0);
  const touched = [], ingFor = new Map(), neededFor = new Map(), measured = new Set();
  const touch = (i, name) => {
    if (!ingFor.has(i)) { touched.push(i); ingFor.set(i, []); }
    if (!ingFor.get(i).includes(name)) ingFor.get(i).push(name);
  };

function tonightPicks(maxMinutes, excluded) {
  const sd = soonDays(), st = staples(), t = todayISO();
  const urgent = state.pantry
    .map(p => [p, expiryStatus(p.expiresAt, sd)])
    .filter(([, s]) => s.kind === "soon")
    .sort((a, b) => a[1].urgency - b[1].urgency);
  const scored = [];
  state.recipes.forEach((r, index) => {
    if (excluded.has(r.id)) return;
    const total = (r.prepMinutes || 0) + (r.cookMinutes || 0);
    if (maxMinutes && total > maxMinutes) return;
    const m = matchRecipe(r, state.pantry, st, sd);
    if (!m.required || m.missing.length > 2) return;
    const req = r.ingredients.filter(i => !i.isOptional);
    const rescues = urgent.filter(([p]) => req.some(i => namesMatch(p.name, i.name))).map(([p]) => p.name);
    let score = rescues.length * 3 + m.coverage * 4 - m.missing.length * 1.5;
    if (r.isFavorite) score += 1;
    if (r.lastCookedAt) { const d = daysBetween(r.lastCookedAt, t); if (d < 3) score -= 3; else if (d < 7) score -= 1; }
    const tags = new Set((r.tags || []).map(x => x.toLowerCase()));
    if (tags.has("dessert") || (tags.has("breakfast") && !tags.has("dinner") && !tags.has("lunch"))) score -= 2;
    scored.push({ r, m, rescues, score, total, index, reason: tonightReason(m, rescues) });

}

function checkInQueue(pantry, soon, limit = 15) {

function receiptItems(lines) {

    const price = Number(line.price) > 0 ? Number(line.price) : 0;
    const shelf = parseInt(line.shelf_life_days, 10) > 0 ? parseInt(line.shelf_life_days, 10) : null;
    const key = n + "|" + unit.toLowerCase() + "|" + location;

  const out = [];
  let list = null;
  for (const raw of String(text).split("\n")) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/), num = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (bullet || num) {
      const type = bullet ? "ul" : "ol";
      if (!list || list.type !== type) { if (list) out.push(`</${list.type}>`); list = { type }; out.push(`<${type}>`); }
      out.push(`<li>${inline((bullet || num)[1])}</li>`);
      continue;
    }
    if (list) { out.push(`</${list.type}>`); list = null; }
    if (!line.trim()) continue;
    const h = line.match(/^#{1,6}\s+(.*)$/);
    out.push(h ? `<p><strong>${inline(h[1])}</strong></p>` : `<p>${inline(line)}</p>`);
  }
  if (list) out.push(`</${list.type}>`);
  return out.join("");
}

let toastTimer;
function toast(msg) {
  const root = document.getElementById("toast-root");
  root.innerHTML = msg ? `<div class="toast" role="status">${esc(msg)}</div>` : "";
  clearTimeout(toastTimer);
  if (msg) toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2600);
}

// ---------- Views ----------
function nav(title, left = "", right = "", small = false) {
  return `<header class="nav"><div class="nav-row"><div>${left}</div><div>${right}</div></div><h1 class="${small ? "small" : ""}">${esc(title)}</h1></header>`;
}

function tonightView() {
  const sd = soonDays();
  const dateLine = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  let body = `<p style="margin:-8px 0 16px;color:var(--text-2)">${esc(dateLine)}</p>`;
  const entry = tonightEntry();
  if (entry) {
    const r = recipeById(entry.recipeId);
    const total = (r.prepMinutes || 0) + (r.cookMinutes || 0);
    body += `<section class="group"><h3 class="group-title"><span>Tonight's dinner</span></h3><div class="card" style="padding:14px;display:grid;gap:10px">
      <div style="font-size:20px;font-weight:700">${esc(r.title)}</div>
      <div class="row-sub" style="margin:0">${esc([total ? total + " min" : "", "serves " + entry.servings].filter(Boolean).join(" · "))}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn small" data-action="tonight-cooked" data-id="${entry.id}">I cooked it</button><button class="btn small secondary" data-action="open-recipe" data-id="${r.id}">Recipe</button><span style="flex:1"></span><button class="text-btn" style="color:var(--red);font-size:14px" data-action="tonight-change" data-id="${entry.id}">Change</button></div>
    </div></section>`;
  }
  const soon = state.pantry.filter(p => isUrgent(expiryStatus(p.expiresAt, sd))).sort((a, b) => expiryStatus(a.expiresAt, sd).urgency - expiryStatus(b.expiresAt, sd).urgency);
  if (soon.length) {
    body += `<section class="group"><h3 class="group-title"><span>Use soon</span></h3><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${soon.map(p => `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 5px 5px 12px;white-space:nowrap;font-size:14px">${esc(p.name)} ${badge(expiryStatus(p.expiresAt, sd))}</span>`).join("")}</div></section>`;
  }
  body += seg("tonight-time", String(ui.tonightMax), [["0", "Any time"], ["30", "≤ 30 min"], ["45", "≤ 45 min"]]);
  const skipped = tonightSkipped();
  const picks = tonightPicks(ui.tonightMax, skipped);
  if (!picks.length) {
    if (!state.recipes.length) body += empty("No recipes yet", "Add a few recipes and Tonight will suggest what to cook from what you have.", '<button class="btn" data-action="add-samples">Add sample recipes</button>');
    else if (!state.pantry.length) body += empty("Your fridge is empty", "Scan your last grocery receipt so Tonight knows what you have.", sample && imagesOK ? '<button class="btn" data-action="open-receipt">Scan a receipt</button>' : '<button class="btn" data-action="new-item">Add an item</button>');
    else body += empty("Nothing fits tonight", ui.tonightMax ? `No recipe under ${ui.tonightMax} minutes works with what you have. Try Any time, or ask the chef.` : "Every recipe needs more than 2 things you don't have. Ask the chef for ideas from what's in your fridge.", skipped.size ? '<button class="btn secondary" data-action="tonight-unskip">Show skipped recipes</button>' : "");
  }
  for (const p of picks) {
    const r = p.r;
    body += `<section class="group"><div class="card" style="padding:14px;display:grid;gap:10px">
      <button class="row-main" data-action="open-recipe" data-id="${r.id}" style="all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline"><span style="flex:1;font-size:20px;font-weight:700;line-height:1.2">${esc(r.title)} ${r.isFavorite ? '<span class="heart">♥</span>' : ""}</span>${coverageBadge(p.m)}</button>
      <div style="font-size:15px;color:${p.rescues.length ? "var(--accent)" : "var(--text-2)"}">${p.rescues.length ? "🌿 " : "✓ "}${esc(p.reason)}</div>
      ${p.total || p.m.missing.length ? `<div class="row-sub" style="margin:0">${esc([p.total ? p.total + " min" : "", p.m.missing.length ? "need " + p.m.missing.join(", ").toLowerCase() : ""].filter(Boolean).join(" · "))}</div>` : ""}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn small" data-action="cook-tonight" data-id="${r.id}">Cook this</button>${p.m.missing.length ? `<button class="btn small secondary" data-action="add-missing" data-id="${r.id}">Add to list</button>` : ""}<span style="flex:1"></span><button class="text-btn" style="font-size:14px;color:var(--text-2)" data-action="tonight-skip" data-id="${r.id}">Not tonight</button></div>
    </div></section>`;

  return nav("Tonight", "", `<button class="icon-btn" data-action="open-chef" aria-label="Chef">${ICONS.sparkles}</button>`) + body;
}

function fridgeView() {
  const sd = soonDays();
  const q = ui.fridgeSearch.trim().toLowerCase();
  const items = state.pantry.filter(it => (ui.fridgeFilter === "all" || it.location === ui.fridgeFilter) && (!q || it.name.toLowerCase().includes(q)));
  const byUrgency = (a, b) => expiryStatus(a.expiresAt, sd).urgency - expiryStatus(b.expiresAt, sd).urgency || a.name.localeCompare(b.name);
  const row = it => {
    const st = expiryStatus(it.expiresAt, sd);
    const sub = [fmtQty(it.quantity, it.unit), it.category].filter(Boolean).join(" · ");
    return `<button class="row" data-action="edit-item" data-id="${it.id}"><div class="row-main"><div class="row-title">${esc(it.name)}</div>${sub ? `<div class="row-sub">${esc(sub)}</div>` : ""}</div>${badge(st)}</button>`;
  };
  let body = "";
  if (!state.pantry.length) {
    body = empty("Your fridge is empty", "Scan your last grocery receipt to fill it in one go, or add items yourself.", (sample && imagesOK ? '<button class="btn" data-action="open-receipt">Scan a receipt</button><button class="btn secondary" data-action="new-item">Add an item</button>' : '<button class="btn" data-action="new-item">Add an item</button>'));
  } else if (!items.length) {
    body = empty("No matches", `Nothing called “${ui.fridgeSearch}”.`);
  } else {
    const urgent = items.filter(it => isUrgent(expiryStatus(it.expiresAt, sd))).sort(byUrgency);
    if (urgent.length) body += group("Use soon", urgent.map(row).join(""));
    for (const loc of LOCATIONS) {
      const list = items.filter(it => it.location === loc && !isUrgent(expiryStatus(it.expiresAt, sd))).sort(byUrgency);
      if (list.length) body += group(cap(loc), list.map(row).join(""), `<span>${list.length}</span>`);
    }
  }
  const ciCount = checkInQueue(state.pantry, sd).length;
  if (state.pantry.length && checkInDue() && ciCount) {
    body = `<section class="group"><div class="card"><button class="row link" data-action="open-checkin"><span style="font-size:22px;color:var(--accent)" aria-hidden="true">✓</span><div class="row-main"><div class="row-title" style="font-weight:600">Weekly check-in</div><div class="row-sub">${ciCount} item${ciCount === 1 ? "" : "s"} to confirm · about 2 minutes</div></div><span class="chev" aria-hidden="true">›</span></button></div></section>` + body;
  }
  return nav("Fridge",
      `<button class="icon-btn" data-action="open-settings" aria-label="Settings">${ICONS.gear}</button>`,
      `<button class="icon-btn" data-action="fridge-add" aria-label="Add">${ICONS.plus}</button>`) +
    `<input class="search" id="fridge-search" data-bind="fridgeSearch" type="search" placeholder="Search items" value="${esc(ui.fridgeSearch)}" autocomplete="off">` +
    seg("fridge-filter", ui.fridgeFilter, [["all", "All"], ["fridge", "Fridge"], ["freezer", "Freezer"], ["pantry", "Pantry"]]) + body;
}

function recipesView() {
  if (ui.recipeId && recipeById(ui.recipeId)) return recipeDetailView(recipeById(ui.recipeId));
  ui.recipeId = null;
  const q = ui.recipeSearch.trim().toLowerCase();
  const sd = soonDays(), st = staples();
  let rows = state.recipes
    .filter(r => !q || r.title.toLowerCase().includes(q) || (r.tags || []).some(t => t.toLowerCase().includes(q)))
    .map(r => ({ r, m: matchRecipe(r, state.pantry, st, sd) }));
  if (ui.recipeMode === "favorites") rows = rows.filter(x => x.r.isFavorite);
  if (ui.recipeMode === "all" || ui.recipeMode === "favorites") rows.sort((a, b) => a.r.title.localeCompare(b.r.title));
  else rows.sort((a, b) => (isBetter(a.m, b.m) ? -1 : isBetter(b.m, a.m) ? 1 : 0));
  const row = ({ r, m }) => {
    const total = (r.prepMinutes || 0) + (r.cookMinutes || 0);
    const parts = [];
    if (total) parts.push(`${total} min`);
    if (m.expiring) parts.push(`uses ${m.expiring} expiring`);
    if (m.missing.length) parts.push("need " + m.missing.slice(0, 3).join(", "));
    return `<button class="row link" data-action="open-recipe" data-id="${r.id}"><div class="row-main"><div class="row-title">${esc(r.title)} ${r.isFavorite ? '<span class="heart" aria-label="Favorite">♥</span>' : ""}</div>${parts.length ? `<div class="row-sub">${esc(parts.join(" · "))}</div>` : ""}</div>${coverageBadge(m)}</button>`;
  };
  let body = "";
  if (!state.recipes.length) {
    body = empty("No recipes yet", "Add your own, import one with AI, or start with 20 sample recipes.", '<button class="btn" data-action="add-samples">Load sample recipes</button><button class="btn secondary" data-action="new-recipe">New recipe</button>');
  } else if (!rows.length) {
    body = empty(ui.recipeMode === "favorites" && !q ? "No favorites yet" : "No matches", ui.recipeMode === "favorites" && !q ? "Tap the heart on a recipe to keep it here." : `Nothing matches “${ui.recipeSearch}”.`);
  } else if (ui.recipeMode === "cookable") {
    const ready = rows.filter(x => x.m.canMake), almost = rows.filter(x => !x.m.canMake && x.m.missing.length <= 2), rest = rows.filter(x => x.m.missing.length > 2);
    if (ready.length) body += group("Ready to cook", ready.map(row).join(""));
    if (almost.length) body += group("Missing 1–2 items", almost.map(row).join(""));
    if (rest.length) body += group("Needs shopping", rest.map(row).join(""));
  } else {
    body = group(ui.recipeMode === "favorites" ? "Favorites" : `${rows.length} recipes`, rows.map(row).join(""));
  }
  return nav("Recipes", "", `<button class="icon-btn" data-action="recipe-add" aria-label="Add recipe">${ICONS.plus}</button>`) +
    `<input class="search" id="recipe-search" data-bind="recipeSearch" type="search" placeholder="Search recipes or tags" value="${esc(ui.recipeSearch)}" autocomplete="off">` +
    seg("recipe-mode", ui.recipeMode, [["cookable", "Can make"], ["all", "All"], ["favorites", "Favorites"]]) + body;
}

function recipeDetailView(r) {
  const st = staples(), sd = soonDays();
  const m = matchRecipe(r, state.pantry, st, sd);
  const stapleKeys = new Set(st.map(normalize));
  const has = ing => stapleKeys.has(normalize(ing.name)) || state.pantry.some(p => namesMatch(p.name, ing.name));
  const total = (r.prepMinutes || 0) + (r.cookMinutes || 0);
  const meta = [total ? `${total} min` : "", `Serves ${r.servings}`, r.cuisine ? cap(r.cuisine) : "", r.cookCount ? `Cooked ${r.cookCount}×` : ""].filter(Boolean);
  const ings = r.ingredients.map(ing => `<div class="row"><span class="check ${has(ing) ? "on" : ""}" aria-label="${has(ing) ? "You have this" : "Missing"}"></span><div class="row-main"><div class="row-title">${esc(ing.name)}${ing.isOptional ? ' <span class="row-sub">(optional)</span>' : ""}</div>${ing.note ? `<div class="row-sub">${esc(ing.note)}</div>` : ""}</div><span class="row-trail">${esc(fmtQty(ing.quantity, ing.unit))}</span></div>`).join("");
  const missingBtn = m.missing.length ? `<button class="row action" data-action="add-missing" data-id="${r.id}">Add ${m.missing.length} missing to shopping list</button>` : "";
  const steps = (r.instructions || []).map((s, i) => `<div class="step"><span class="step-n">${i + 1}</span><span>${esc(s)}</span></div>`).join("");
  return nav(r.title,
      `<button class="text-btn" data-action="back">${ICONS.back}Recipes</button>`,
      `<button class="icon-btn" data-action="toggle-fav" data-id="${r.id}" aria-label="${r.isFavorite ? "Unfavorite" : "Favorite"}">${r.isFavorite ? ICONS.heartFill : ICONS.heart}</button><button class="text-btn" data-action="edit-recipe" data-id="${r.id}">Edit</button>`, true) +
    `<section class="group"><div class="card summary">${r.summary ? `<div>${esc(r.summary)}</div>` : ""}<div class="meta">${meta.map(x => `<span>${esc(x)}</span>`).join("")}</div>${(r.tags || []).length ? `<div class="tags">${esc(r.tags.map(t => "#" + t).join(" "))}</div>` : ""}</div></section>` +
    group("Ingredients", ings + missingBtn, coverageBadge(m)) +
    (steps ? group("Steps", steps) : "") +
    `<section class="group"><div class="card">
      <button class="row action" data-action="cooked" data-id="${r.id}">I cooked this</button>
      <button class="row action" data-action="plan-recipe" data-id="${r.id}">Add to meal plan</button>
      <button class="row danger" data-action="delete-recipe" data-id="${r.id}">Delete recipe</button>
    </div></section>`;
}

function planView() {
  const days = [...Array(7)].map((_, i) => addDays(ui.weekStart, i));
  const end = addDays(ui.weekStart, 7);
  const weekEntries = state.plan.filter(e => e.day >= ui.weekStart && e.day < end);
  const fmt = (iso, opts) => fromISO(iso).toLocaleDateString(undefined, opts);
  const title = `${fmt(ui.weekStart, { month: "short", day: "numeric" })} – ${fmt(addDays(ui.weekStart, 6), { month: "short", day: "numeric" })}`;
  const today = todayISO();
  let body = `<div class="week"><button class="icon-btn" data-action="week" data-value="-1" aria-label="Previous week">${ICONS.left}</button><strong>${esc(title)}</strong><button class="icon-btn" data-action="week" data-value="1" aria-label="Next week">${ICONS.right}</button></div>`;
  for (const d of days) {
    const entries = weekEntries.filter(e => e.day === d).sort((a, b) => SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot));
    const rows = entries.map(e => {
      const r = recipeById(e.recipeId);
      return `<div class="row"><span class="slot">${esc(e.slot)}</span><button class="row-main text-btn" style="color:var(--text);justify-content:flex-start;padding:0;text-align:left" data-action="open-recipe" data-id="${r ? r.id : ""}" ${r ? "" : "disabled"}>${esc(r ? r.title : "Removed recipe")}</button><span class="row-trail">×${e.servings}</span><button class="text-btn" style="color:var(--red);font-size:14px" data-action="remove-entry" data-id="${e.id}" aria-label="Remove">Remove</button></div>`;
    }).join("");
    const label = fmt(d, { weekday: "long", month: "short", day: "numeric" });
    body += `<section class="group"><h3 class="group-title"><span class="${d === today ? "today-title" : ""}">${esc(d === today ? "Today · " + label : label)}</span></h3><div class="card">${rows}<button class="row action" data-action="add-meal" data-day="${d}">＋ Add meal</button></div></section>`;
  }
  return nav("Meal plan",
      `<button class="text-btn" data-action="week-today">Today</button>`,
      `<button class="text-btn" data-action="shop-week" ${weekEntries.length ? "" : "disabled"}>Shop for week</button>`) + body;
}

function shoppingView() {
  const toBuy = state.shopping.filter(s => !s.checked), inCart = state.shopping.filter(s => s.checked);
  const row = s => `<button class="row" data-action="toggle-shop" data-id="${s.id}"><span class="check ${s.checked ? "on" : ""}"></span><div class="row-main"><div class="row-title ${s.checked ? "strike" : ""}">${esc(s.name)}</div>${s.reason ? `<div class="row-sub">${esc(s.reason)}</div>` : ""}</div><span class="row-trail">${esc(fmtQty(s.quantity, s.unit))}</span></button>`;
  let body = `<form data-action="shop-add" class="group"><div class="card"><div class="field"><label for="shop-new" class="visually-hidden">Add item</label><input id="shop-new" data-bind="shopDraft" style="text-align:left" placeholder="＋ Add item" value="${esc(ui.shopDraft)}" autocomplete="off" enterkeyhint="done"></div></div></form>`;
  if (!state.shopping.length) body += empty("Nothing to buy", "Add items here, from a recipe's missing ingredients, or from your meal plan.");
  if (toBuy.length) body += group("To buy", toBuy.map(row).join(""), `<button class="text-btn" style="font-size:13px;padding:0" data-action="copy-list">Copy list</button>`);
  if (inCart.length) body += group("In cart", inCart.map(row).join("")) +
    `<section class="group"><div class="card"><button class="row action" data-action="put-away">Put checked items in the fridge</button><button class="row danger" data-action="clear-checked">Clear checked</button></div></section>`;
  return nav("Shopping", "", sample && imagesOK ? `<button class="text-btn" data-action="open-receipt">Scan receipt</button>` : "") + body;
}

function chefView() {
  if (!sample) {
    return nav("Chef", `<button class="text-btn" data-action="tab" data-value="tonight">${ICONS.back}Tonight</button>`) + empty("Chef isn't available here", "The chef uses your Claude account. Open this page in claude.ai (signed in) and allow Claude when asked.") +
      `<p class="footnote" style="text-align:center">In the iPhone app, the chef uses your own Anthropic API key instead.</p>`;
  }
  const suggestions = ["What can I make tonight with what I have?", "What should I cook first before it goes bad?", "Plan three easy dinners for this week.", "Something quick, under 20 minutes."];
  let body = '<div class="chat">';
  if (!ui.chat.length && !ui.chatBusy) {
    body += `<p style="color:var(--text-2);margin:0">Ask what to cook. The chef can see your fridge, recipes and meal plan.</p><div class="suggest">${suggestions.map(s => `<button data-action="suggest" data-value="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
  }
  ui.chat.forEach((t, i) => {

    else body += `<div class="bubble bot">${md(t.content)}<div class="bubble-actions"><button class="btn small secondary" data-action="save-chat-recipe" data-index="${i}" ${ui.savingIndex >= 0 ? "disabled" : ""}>${ui.savingIndex === i ? "Saving…" : "Save as recipe"}</button></div></div>`;
  });
  if (ui.chatBusy) body += `<div class="bubble bot" id="streaming">${ui.chatStreaming ? md(ui.chatStreaming) : '<span class="thinking">Thinking…</span>'}</div>`;

  return nav("Chef", `<button class="text-btn" data-action="tab" data-value="tonight">${ICONS.back}Tonight</button>`, ui.chat.length && !ui.chatBusy ? `<button class="text-btn" data-action="new-chat">New chat</button>` : "") + body;
}

function composer() {
  if (ui.tab !== "chef" || !sample) return "";
  return `<form class="composer" data-action="chat-send"><label for="chat-input" class="visually-hidden">Message</label><textarea id="chat-input" data-bind="chatDraft" rows="1" placeholder="Ask the chef…" enterkeyhint="send">${esc(ui.chatDraft)}</textarea>${ui.chatBusy
    ? `<button type="button" class="send" data-action="chat-stop" aria-label="Stop">${ICONS.stop}</button>`
    : `<button type="submit" class="send" aria-label="Send" ${ui.chatDraft.trim() ? "" : "disabled"}>${ICONS.up}</button>`}</form>`;
}

const TABS = [["tonight", "Tonight", "fork"], ["fridge", "Fridge", "fridge"], ["recipes", "Recipes", "book"], ["plan", "Plan", "calendar"], ["shopping", "Shopping", "cart"]];

function render() {
  const active = document.activeElement;
  const focusId = active && active.id, selStart = active && active.selectionStart, selEnd = active && active.selectionEnd;
  const app = document.getElementById("app");
  const view = { tonight: tonightView, fridge: fridgeView, recipes: recipesView, plan: planView, shopping: shoppingView, chef: chefView }[ui.tab]();
  app.innerHTML = view + composer();
  app.classList.toggle("chat-mode", ui.tab === "chef");
  document.getElementById("tabbar").innerHTML = TABS.map(([id, label, icon]) =>
    `<button class="tab" data-action="tab" data-value="${id}" ${ui.tab === id ? 'aria-current="page"' : ""}>${ICONS[icon]}<span>${label}</span></button>`).join("");
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el.closest("#app")) {
      el.focus();
      try { if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text input */ }
    }
  }
}

// ---------- Sheets ----------
function openSheet(sheet) { ui.sheet = sheet; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }
function sheetFrame(title, body, { left = '<button class="text-btn" data-action="close-sheet">Cancel</button>', right = "", cls = "" } = {}) {
  return `<div class="sheet-wrap"><div class="sheet-backdrop" data-action="close-sheet"></div><div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><div class="left">${left}</div><h2>${esc(title)}</h2><div class="right">${right}</div></div><div class="sheet-body">${body}</div></div></div>`;
}
function renderSheet() {
  const root = document.getElementById("sheet-root");
  const s = ui.sheet;
  if (!s) { root.innerHTML = ""; return; }
  root.innerHTML = ({ menu: menuSheet, item: itemSheet, scan: scanSheet, receipt: receiptSheet, cook: cookSheet, checkin: checkInSheet, recipe: recipeSheet, import: importSheet, plan: planSheet, pick: pickSheet, settings: settingsSheet, confirm: confirmSheet })[s.type](s);
  const first = root.querySelector("[autofocus]");
  if (first) first.focus();

function checkInSheet(s) {
  const items = s.ids.map(id => state.pantry.find(p => p.id === id)).filter(Boolean);
  if (!items.length) {
    return sheetFrame("Weekly check-in", empty("All caught up", "Nothing in your kitchen needs checking right now.", '<button class="btn" data-action="save-checkin">Done</button>'), { left: '<button class="text-btn" data-action="close-sheet">Close</button>' });
  }
  const done = s.pos >= items.length || s.summary;
  if (!done) {
    const it = items[s.pos];
    const st = expiryStatus(it.expiresAt, soonDays());
    const since = it.lastConfirmedAt ? `Last confirmed ${daysBetween(it.lastConfirmedAt, todayISO())} days ago` : it.addedAt ? `Added ${daysBetween(it.addedAt, todayISO())} days ago` : "";
    const pct = Math.round(s.pos / items.length * 100);
    const body = `<div style="display:grid;gap:18px">
      <div><div style="height:4px;border-radius:2px;background:var(--fill)"><div style="height:4px;border-radius:2px;background:var(--accent);width:${pct}%"></div></div><p class="footnote" style="text-align:center;margin-top:6px;font-variant-numeric:tabular-nums">${s.pos + 1} of ${items.length}</p></div>
      <div class="card" style="padding:28px 16px;display:grid;gap:8px;justify-items:center;text-align:center">
        <div style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2)">${esc(cap(it.location))}</div>
        <div style="font-size:30px;font-weight:700;line-height:1.15;text-wrap:balance">${esc(it.name)}</div>
        ${fmtQty(it.quantity, it.unit) ? `<div style="color:var(--text-2)">${esc(fmtQty(it.quantity, it.unit))}</div>` : ""}
        ${badge(st)}
        ${since ? `<div class="footnote" style="margin:0">${esc(since)}</div>` : ""}
      </div>
      <div style="display:grid;gap:10px">
        <button class="btn" data-action="ci-answer" data-value="kept" style="padding:15px">Still have it</button>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="btn secondary" data-action="ci-answer" data-value="used" style="padding:15px;color:var(--text);background:var(--fill)">Used it</button>
          <button class="btn secondary" data-action="ci-answer" data-value="tossed" style="padding:15px;color:var(--red);background:var(--red-soft)">Tossed it</button>
        </div>
        <div style="display:flex;justify-content:space-between"><button class="text-btn" data-action="ci-undo" ${s.pos ? "" : "disabled"}>Undo</button><button class="text-btn" data-action="ci-skip">Skip</button></div>
      </div></div>`;
    return sheetFrame("Weekly check-in", body, { left: '<button class="text-btn" data-action="close-sheet">Close</button>', right: Object.keys(s.answers).length ? '<button class="text-btn" data-action="ci-finish">Finish</button>' : "" });
  }
  const by = k => items.filter(it => s.answers[it.id] === k);
  const kept = by("kept"), used = by("used"), tossed = by("tossed");
  const tossedValue = tossed.reduce((a, it) => a + (it.price || 0), 0);
  const since = addDays(todayISO(), -30);
  const recent = (state.events || []).filter(e => e.date >= since);
  const mUsed = recent.filter(e => e.kind === "used").length + used.length;
  const mTossed = recent.filter(e => e.kind === "tossed").length + tossed.length;
  const mValue = recent.filter(e => e.kind === "tossed").reduce((a, e) => a + (e.value || 0), 0) + tossedValue;
  const rate = mUsed + mTossed ? Math.round(mTossed / (mUsed + mTossed) * 100) : null;
  let body = group("This check-in", [["Still here", kept.length], ["Used", used.length], ["Tossed", tossed.length + (tossedValue ? ` · $${tossedValue.toFixed(2)}` : "")]].map(([l, v]) => `<div class="row"><div class="row-main">${l}</div><span class="row-trail">${v}</span></div>`).join(""));
  if (rate !== null) body = body.replace("</section>", `<p class="footnote">Last 30 days: ${mTossed} of ${mUsed + mTossed} items tossed (${rate}%)${mValue ? `, about $${mValue.toFixed(2)} of food` : ""}.</p></section>`);
  const gone = [...used, ...tossed];
  if (gone.length) {
    const listed = state.shopping.filter(x => !x.checked).map(x => x.name);
    body += group("Buy again?", gone.map(it => {
      const onList = listed.some(n => namesMatch(n, it.name));
      return `<button class="row" data-action="ci-restock" data-id="${it.id}" ${onList ? "disabled" : ""}><span class="check ${!onList && s.restock[it.id] ? "on" : ""}"></span><div class="row-main"><div class="row-title">${esc(it.name)}</div>${onList ? '<div class="row-sub">Already on your list</div>' : ""}</div></button>`;
    }).join(""));
  }
  body += '<button class="btn" data-action="save-checkin" style="width:100%">Save check-in</button>';
  return sheetFrame("Check-in done", body, { left: '<button class="text-btn" data-action="close-sheet">Close</button>' });
}

function cookSheet(s) {
  const r = recipeById(s.recipeId);
  if (!r) return sheetFrame("Update your fridge", "");
  const ds = cookDeductions(r, s.servings / Math.max(r.servings || 1, 1), state.pantry, staples());
  let body = `<section class="group"><div class="card"><div class="field"><label>Made</label><div class="stepper" style="margin-left:auto"><button type="button" data-action="cook-servings" data-value="-1" aria-label="Fewer servings">−</button><strong style="min-width:5.5em;text-align:center">${s.servings} serving${s.servings === 1 ? "" : "s"}</strong><button type="button" data-action="cook-servings" data-value="1" aria-label="More servings">+</button></div></div></div>${s.servings !== r.servings ? `<p class="footnote">The recipe serves ${r.servings}; amounts are scaled.</p>` : ""}</section>`;
  let willRemove = 0;
  if (!ds.length) {
    body += `<p class="footnote" style="margin:0">Nothing in your fridge matched this recipe's ingredients, so there's nothing to update.</p>`;
  } else {
    body += group("From your fridge", ds.map(d => {
      const item = state.pantry[d.index];
      const on = !s.skipped[d.id];
      const had = fmtQty(item.quantity, item.unit);
      let sub;
      if (d.change === "reduce") sub = `${had || "?"} → ${fmtQty(d.left, item.unit)}`;
      else if (d.change === "remove") sub = "Used up" + (had ? ` (had ${had})` : "");
      else sub = `Recipe uses ${d.neededText || "some"}` + (had ? ` · you have ${had}` : "");
      if (on && (d.change === "remove" || (d.change === "unknown" && s.usedUp[d.id]))) willRemove++;
      const choice = on && d.change === "unknown"
        ? `<div class="seg" style="margin:0 14px 12px 48px">${[["some", "Some left"], ["used", "Used it all"]].map(([v, l]) => `<button type="button" data-action="cook-left" data-id="${d.id}" data-value="${v}" aria-pressed="${(v === "used") === !!s.usedUp[d.id]}">${l}</button>`).join("")}</div>` : "";
      return `<button class="row" data-action="cook-toggle" data-id="${d.id}"><span class="check ${on ? "on" : ""}"></span><div class="row-main"><div class="row-title ${on ? "" : "strike"}">${esc(item.name)}</div><div class="row-sub">${esc(sub)}</div></div></button>${choice}`;
    }).join("")) + `<p class="footnote" style="margin-top:-14px;margin-bottom:18px">Staples like salt and oil aren't tracked. Tap anything you didn't use to leave it unchanged.</p>`;
    if (willRemove) body += `<section class="group"><div class="card"><button class="row" data-action="cook-list"><span class="check ${s.addToList ? "on" : ""}"></span><div class="row-main"><div class="row-title">Add used-up items to shopping list</div></div></button></div></section>`;
  }
  return sheetFrame("Update your fridge", body, { right: `<button class="text-btn" data-action="apply-cook" style="font-weight:600">${ds.length ? "Update" : "Mark cooked"}</button>` });
}

function receiptSheet(s) {
  const pickLabel = s.status === "review" ? "Scan a different receipt" : maxImages > 1 ? "Take or choose receipt photos" : "Take or choose receipt photo";
  let body = s.status === "review" ? "" : `<p class="footnote" style="margin:0 0 12px">Lay the receipt flat in good light.${maxImages > 1 ? ` For a long receipt, take up to ${Math.min(maxImages, 5)} photos, top to bottom.` : ""} Claude reads each line, skips non-food items and estimates how long everything keeps.</p>`;
  body += `<label class="btn ${s.status === "review" ? "secondary" : ""}" style="display:block;text-align:center;margin-bottom:14px">${pickLabel}<input type="file" accept="image/*" ${maxImages > 1 ? "multiple" : ""} id="receipt-file" class="visually-hidden" data-action-change="receipt-file"></label>`;
  if (s.status === "reading") body += `<p class="thinking" style="text-align:center">Reading ${s.pageCount > 1 ? s.pageCount + " pages" : "receipt"}…</p>`;
  if (s.error) body += `<p class="error" role="alert">${esc(s.error)}</p>`;
  if (s.status === "review") {
    body += `<section class="group"><div class="card">${s.store ? `<div class="field"><label>Store</label><span style="flex:1;text-align:right;color:var(--text-2)">${esc(s.store)}</span></div>` : ""}<div class="field"><label for="rc-date">Purchased</label><input id="rc-date" type="date" max="${todayISO()}" value="${s.purchased}" data-sheet-change="purchased"></div></div><p class="footnote">Expiry dates are estimated from the purchase date. Tap an item to leave it out.</p></section>`;
    for (const loc of LOCATIONS) {
      const idx = s.items.map((it, i) => i).filter(i => s.items[i].location === loc);
      if (!idx.length) continue;
      body += group(cap(loc), idx.map(i => {
        const it = s.items[i];
        const sub = [fmtQty(it.quantity, it.unit), it.price ? "$" + it.price.toFixed(2) : "", it.category].filter(Boolean).join(" · ");
        return `<button class="row" data-action="toggle-receipt" data-index="${i}"><span class="check ${it.include ? "on" : ""}"></span><div class="row-main"><div class="row-title ${it.include ? "" : "strike"}">${esc(it.name)}</div>${sub ? `<div class="row-sub">${esc(sub)}</div>` : ""}</div>${badge(expiryStatus(receiptExpiry(it, s.purchased), soonDays()))}</button>`;
      }).join(""));
    }
    const covered = receiptCoveredShopping(s);
    if (covered.length) {
      body += `<section class="group"><div class="card"><button class="row" data-action="toggle-receipt-shop"><span class="check ${s.checkOff ? "on" : ""}"></span><div class="row-main"><div class="row-title">Check off ${covered.length} item${covered.length === 1 ? "" : "s"} on your shopping list</div><div class="row-sub">${esc(covered.map(x => x.name).join(", "))}</div></div></button></div></section>`;
    }
    if (s.skipped.length) body += `<p class="footnote">Skipped ${s.skipped.length} non-food line${s.skipped.length === 1 ? "" : "s"}: ${esc(s.skipped.join(", "))}</p>`;
  }
  const count = s.status === "review" ? s.items.filter(x => x.include).length : 0;
  return sheetFrame("Scan receipt", body, { right: `<button class="text-btn" data-action="add-receipt" style="font-weight:600" ${count ? "" : "disabled"}>Add ${count || ""}</button>` });
}
function receiptCoveredShopping(s) {
  const bought = s.items.filter(x => x.include).map(x => x.name);
  return state.shopping.filter(x => !x.checked && bought.some(b => namesMatch(b, x.name)));
}

function ingredientLine(i) {
  return [fmtQty(i.quantity, i.unit), i.name].filter(Boolean).join(" ") + (i.note ? `, ${i.note}` : "") + (i.isOptional ? " (optional)" : "");
}
const UNITS = ["cups", "cup", "tbsp", "tsp", "g", "kg", "oz", "lb", "lbs", "ml", "l", "slices", "slice", "cloves", "clove", "cans", "can", "pinch", "bunch", "bag", "head", "stalks", "sprigs", "pieces", "piece", "quarts", "pints"];
function parseQuantity(s) {
  const map = { "¼": 0.25, "½": 0.5, "¾": 0.75, "⅓": 0.33, "⅔": 0.67 };
  let total = 0;
  for (const part of s.split(/\s+/)) {
    if (!part) continue;
    const m = part.match(/^(\d+(?:\.\d+)?)?([¼½¾⅓⅔])?$/);
    if (m && (m[1] || m[2])) { total += (m[1] ? parseFloat(m[1]) : 0) + (m[2] ? map[m[2]] : 0); continue; }
    const f = part.match(/^(\d+)\/(\d+)$/);
    if (f) { total += Number(f[1]) / Number(f[2]); continue; }
    return null;
  }
  return total;
}
function parseIngredientLine(line) {
  let text = line.trim();
  if (!text) return null;
  let isOptional = false;
  if (/\(optional\)\s*$/i.test(text)) { isOptional = true; text = text.replace(/\(optional\)\s*$/i, "").trim(); }
  let note = "";
  const comma = text.indexOf(",");
  if (comma > 0) { note = text.slice(comma + 1).trim(); text = text.slice(0, comma).trim(); }
  const words = text.split(/\s+/);
  let quantity = 0, i = 0;
  while (i < words.length && parseQuantity(words.slice(0, i + 1).join(" ")) !== null) i++;
  if (i > 0) quantity = parseQuantity(words.slice(0, i).join(" "));
  let unit = "";
  if (i < words.length - 1 && UNITS.includes(words[i].toLowerCase())) { unit = words[i]; i++; }
  const name = words.slice(i).join(" ") || text;
  return { name, quantity, unit, note, isOptional };
}

  return sheetFrame("Settings", body, { right: '<button class="text-btn" type="submit" form="settings-form" style="font-weight:600">Done</button>', left: "" });
}

function addMissingFor(planned) {
  const needed = buildShopping(planned, state.pantry, state.shopping.filter(s => !s.checked).map(s => s.name), staples());
  for (const n of needed) state.shopping.push({ id: uid(), name: n.name, quantity: Math.round(n.quantity * 100) / 100, unit: n.unit, checked: false, reason: n.forRecipes.join(", ") });
  save();
  return needed.length;
}

async function runChat(text) {
  const msg = text.trim();
  if (!msg || ui.chatBusy || !sample) return;
  ui.chat.push({ role: "user", content: msg });
  ui.chatDraft = "";
  ui.chatBusy = true; ui.chatStreaming = ""; ui.chatError = "";
  const ctl = new AbortController();
  ui.chatCtl = ctl;
  render();
  scrollToEnd();
  const turns = [{ role: "user", content: CHEF_RULES + "\n\n" + kitchenContext() }, ...ui.chat.slice(-12)];
  try {
    const { text: reply } = await sample(turns, {
      cache: false,
      signal: ctl.signal,
      onText: ({ text }) => {
        ui.chatStreaming = text;
        const el = document.getElementById("streaming");
        if (el) el.innerHTML = md(text);
      },
    });
    ui.chat.push({ role: "assistant", content: reply });
  } catch (e) {
    if (e && e.text && e.code !== "refused") ui.chat.push({ role: "assistant", content: e.text });
    else if (ui.chat.length && ui.chat[ui.chat.length - 1].role === "user") ui.chatDraft = ui.chat.pop().content;
    ui.chatError = copyFor(e);
  } finally {
    ui.chatBusy = false; ui.chatStreaming = ""; ui.chatCtl = null;
    render();
    scrollToEnd();
  }
}
function scrollToEnd() { window.scrollTo({ top: document.body.scrollHeight }); }

async function saveChatRecipe(index) {
  const turn = ui.chat[index];
  if (!turn || !sample || ui.savingIndex >= 0) return;
  ui.savingIndex = index; ui.chatError = ""; render();
  try {
    const g = await sample.json(`Turn the main dish described below into a complete, cookable home recipe. Make good use of the kitchen contents listed after it.\n\n${RECIPE_SHAPE}\n\n## Dish\n${turn.content}\n\n${kitchenContext()}`, { cache: false });
    const r = recipeFromJSON(g);
    state.recipes.push(r); save();
    ui.savingIndex = -1;
    ui.tab = "recipes"; ui.recipeId = r.id;
    render(); window.scrollTo({ top: 0 });
    toast("Saved to Recipes");
  } catch (e) {
    ui.savingIndex = -1; ui.chatError = copyFor(e); render();
  }
}

async function runImport(text) {
  const s = ui.sheet;
  if (!sample) { s.error = "AI import needs Claude. Open this page in claude.ai and allow Claude."; renderSheet(); return; }
  s.text = text; s.working = true; s.error = ""; renderSheet();
  try {
    const g = await sample.json(`If the text below contains a recipe, faithfully extract it. Otherwise create a new recipe for what it describes, making good use of the kitchen contents listed after it. Keep ingredient names plain (preparation goes in the note).\n\n${RECIPE_SHAPE}\n\n## Text\n${text}\n\n${kitchenContext()}`, { cache: false });
    const r = recipeFromJSON(g);
    state.recipes.push(r); save();
    closeSheet();
    ui.tab = "recipes"; ui.recipeId = r.id; render(); window.scrollTo({ top: 0 });
    toast("Recipe imported");
  } catch (e) {
    if (ui.sheet !== s) return;
    s.working = false; s.error = copyFor(e) || "Import stopped."; renderSheet();
  }

async function runScan(file) {
  const s = ui.sheet;
  if (!file) return;
  s.status = "working"; s.error = ""; s.results = null; s.selected = [];
  try { s.preview = URL.createObjectURL(file); } catch (e) { s.preview = ""; }
  renderSheet();
  try {
    const items = await sample.json(`The photo shows groceries (a fridge shelf, pantry, shopping bag, or receipt) for a kitchen inventory app. List each distinct food item you can identify with reasonable confidence; skip non-food items and anything you can't make out. Reply with only a JSON array of objects: {"name": string, "quantity": number (1 if unclear), "unit": string (empty for countable items), "category": string (produce, dairy, meat, grains, condiments...), "location": "fridge" | "freezer" | "pantry", "shelf_life_days": integer (typical days until it spoils from today at that location)}.`, { images: [file], cache: false });
    if (ui.sheet !== s) return;
    const list = (Array.isArray(items) ? items : Array.isArray(items && items.items) ? items.items : []).filter(x => x && x.name).map(x => ({
      name: String(x.name), quantity: Number(x.quantity) || 1, unit: String(x.unit || ""), category: String(x.category || ""),
      location: LOCATIONS.includes(x.location) ? x.location : "fridge", shelf_life_days: Math.max(0, parseInt(x.shelf_life_days, 10) || 0),
    }));
    s.status = "done"; s.results = list; s.selected = list.map(() => true);
    if (!list.length) s.error = "No groceries recognized. Try a closer, well-lit photo.";
  } catch (e) {
    if (ui.sheet !== s) return;
    s.status = "done"; s.error = copyFor(e) || "Scan stopped.";
  }
  renderSheet();
}

async function runReceipt(fileList) {
  const s = ui.sheet;
  const files = [...(fileList || [])].slice(0, Math.min(maxImages, 5));
  if (!files.length) return;
  s.status = "reading"; s.error = ""; s.pageCount = files.length;
  renderSheet();
  const pages = files.length > 1 ? `These ${files.length} images are consecutive parts of one receipt, top to bottom; don't list an item twice where the photos overlap. ` : "";
  try {
    const scan = await sample.json(`${pages}You read grocery store receipts for a kitchen inventory app. Today is ${todayISO()}. Return one entry per purchased product line, in the order printed. Receipts use heavy abbreviations (e.g. "ORG BNLS SKNLS CHKN BRST" is chicken breast, "GRN ONION" is green onions, "HNY CRSP APPL" is Honeycrisp apples); expand them into the plain grocery name a person would say, without brand or package size. Take quantities and weights from the line or the line under it ("2 @ 1.99", "1.37 lb @ 3.49/lb"). Skip subtotals, totals, tax, payment, savings and coupon lines. Keep non-food products (paper towels, soap, bags, deposits) but mark them is_food false. If a line is unreadable, skip it rather than guess.

Reply with only a JSON object: {"store": string (empty if not shown), "purchase_date": "YYYY-MM-DD" or "" if not legible, "items": [{"raw_text": string (line as printed), "name": string, "quantity": number, "unit": string (lb, oz, gal, dozen; empty for countable items), "price": number (line total, 0 if not shown), "category": string (produce, dairy, meat, seafood, bakery, frozen, grains, snacks, beverages, condiments, household...), "location": "fridge" | "freezer" | "pantry", "shelf_life_days": integer (typical days from purchase until it spoils at that location; 0 if it effectively never does), "is_food": boolean}]}`, { images: files, cache: false });
    if (ui.sheet !== s) return;
    const lines = Array.isArray(scan && scan.items) ? scan.items : [];
    const items = receiptItems(lines);
    if (!items.length) {
      s.status = "idle"; s.error = "No food items found on that receipt. Try a sharper photo with the whole receipt in frame.";
    } else {
      s.status = "review"; s.items = items; s.checkOff = true;
      s.store = String((scan && scan.store) || "");
      s.purchased = receiptPurchaseDate(scan && scan.purchase_date);
      s.skipped = lines.filter(l => l && l.is_food === false).map(l => String(l.raw_text || l.name || "")).filter(Boolean);
    }
  } catch (e) {
    if (ui.sheet !== s) return;
    s.status = s.items && s.items.length ? "review" : "idle";
    s.error = copyFor(e) || "Scan stopped.";
  }
  renderSheet();
}

    if (ui.sheet && ui.sheet.type === "import" && ui.sheet.working) return;
    closeSheet();
  },
};

const submits = {
  "save-item": () => {
    const name = document.getElementById("f-name").value.trim();
    if (!name) return;
    const s = ui.sheet;
    const target = s.id ? state.pantry.find(p => p.id === s.id) : { id: uid(), addedAt: todayISO() };
    Object.assign(target, {
      name,
      quantity: parseFloat(document.getElementById("f-qty").value.replace(",", ".")) || 0,
      unit: document.getElementById("f-unit").value.trim(),
      location: document.getElementById("f-loc").value,
      category: document.getElementById("f-cat").value.trim(),
      expiresAt: document.getElementById("f-hasexp").checked ? (document.getElementById("f-exp").value || null) : null,
      notes: document.getElementById("f-notes").value,
    });
    if (!s.id) state.pantry.push(target);
    save(); closeSheet(); render();
  },
  "save-recipe": () => {
    const title = document.getElementById("r-title").value.trim();
    if (!title) return;
    const s = ui.sheet;
    const target = s.id ? recipeById(s.id) : { id: uid(), isFavorite: false, cookCount: 0 };
    Object.assign(target, {
      title,
      summary: document.getElementById("r-summary").value.trim(),
      cuisine: document.getElementById("r-cuisine").value.trim(),
      servings: Math.max(1, parseInt(document.getElementById("r-servings").value, 10) || 1),
      prepMinutes: Math.max(0, parseInt(document.getElementById("r-prep").value, 10) || 0),
      cookMinutes: Math.max(0, parseInt(document.getElementById("r-cook").value, 10) || 0),
      tags: document.getElementById("r-tags").value.split(",").map(t => t.trim()).filter(Boolean),
      ingredients: document.getElementById("r-ings").value.split("\n").map(parseIngredientLine).filter(Boolean),
      instructions: document.getElementById("r-steps").value.split("\n").map(l => l.trim()).filter(Boolean),
    });
    if (!s.id) state.recipes.push(target);
    save(); closeSheet(); ui.tab = "recipes"; ui.recipeId = target.id; render();
  },
  "run-import": () => {
    const text = document.getElementById("imp-text").value.trim();
    if (text && !ui.sheet.working) runImport(text);
  },
  "save-plan": () => {
    const s = ui.sheet;
    const r = recipeById(s.recipeId); if (!r) return;
    const day = document.getElementById("p-day").value || todayISO();
    state.plan.push({ id: uid(), day, slot: document.getElementById("p-slot").value, recipeId: r.id, servings: Math.max(1, parseInt(document.getElementById("p-servings").value, 10) || r.servings) });
    save(); closeSheet(); render(); toast("Added to your meal plan");
  },
  "save-settings": () => {
    state.settings.soonDays = Math.min(14, Math.max(1, parseInt(document.getElementById("s-soon").value, 10) || 3));
    state.settings.staples = document.getElementById("s-staples").value;
    save(); closeSheet(); render();
  },
  "shop-add": () => {
    const name = ui.shopDraft.trim();
    if (!name) return;
    state.shopping.push({ id: uid(), name, quantity: 0, unit: "", checked: false, reason: "" });
    ui.shopDraft = ""; save(); render();
    const f = document.getElementById("shop-new"); if (f) f.focus();
  },
  "chat-send": () => runChat(ui.chatDraft),
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (!el || el.tagName === "FORM") return;
  if (el.classList.contains("sheet-backdrop") && ev.target !== el) return;
  const fn = actions[el.dataset.action];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener("submit", ev => {
  const form = ev.target.closest("form[data-action]");
  if (!form) return;
  ev.preventDefault();
  const fn = submits[form.dataset.action];
  if (fn) fn(form);
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.bind) {
    ui[el.dataset.bind] = el.value;
    if (el.dataset.bind === "chatDraft") {
      const btn = document.querySelector('.composer button[type="submit"]');
      if (btn) btn.disabled = !el.value.trim();
      el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 120) + "px";
    } else if (el.dataset.bind !== "shopDraft") {
      render();
    }
  } else if (el.dataset.sheetBind && ui.sheet) {
    ui.sheet[el.dataset.sheetBind] = el.value;
    const pos = el.selectionStart;
    renderSheet();
    const again = document.getElementById(el.id);
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.actionChange === "toggle-exp") {
    document.getElementById("exp-row").hidden = !el.checked;
    document.getElementById("exp-chips").hidden = !el.checked;
  } else if (el.dataset.actionChange === "scan-file") {
    runScan(el.files && el.files[0]);
  } else if (el.dataset.actionChange === "receipt-file") {
    runReceipt(el.files);
  } else if (el.dataset.sheetChange && ui.sheet) {
    if (el.value) { ui.sheet[el.dataset.sheetChange] = el.value; renderSheet(); }
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.sheet) actions["close-sheet"]();
  if (ev.key === "Enter" && !ev.shiftKey && ev.target.id === "chat-input" && !ev.isComposing) {
    ev.preventDefault();
    if (!ui.chatBusy) runChat(ui.chatDraft);
  }
});

render();
})();
</script>
