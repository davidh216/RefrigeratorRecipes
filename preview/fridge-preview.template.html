/* ===== Base ===== */
* { box-sizing: border-box; }
html, body { background: var(--canvas); color: var(--ink); }
body { margin: 0; font-family: var(--font-text); font-size: 1rem; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; margin: 0; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--beet-text); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -0.14em; overflow: visible; }
.num { font-family: var(--font-rounded); font-weight: 800; font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, p { margin: 0; }

/* Type scale (§3) */
.t-display { font: 800 2rem/1.08 var(--font-text); }
.t-hero { font: 800 1.647rem/1.12 var(--font-text); }
.t-title-heavy { font: 800 1.294rem/1.2 var(--font-text); }
.t-section { font: 800 1.176rem/1.25 var(--font-text); }
.t-card-title { font: 700 1.176rem/1.25 var(--font-text); }
.t-tile-title { font: 800 1rem/1.25 var(--font-text); }
.t-row-title { font: 600 1rem/1.3 var(--font-text); }
.t-body { font: 400 1rem/1.42 var(--font-text); }
.t-detail { font: 400 .882rem/1.35 var(--font-text); }
.t-detail-strong { font: 600 .882rem/1.35 var(--font-text); }
.t-tag { font: 700 .765rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; }
.t-eyebrow { font: 800 .706rem/1.2 var(--font-text); text-transform: uppercase; letter-spacing: .08em; }
.t-number { font: 800 1rem/1.2 var(--font-rounded); font-variant-numeric: tabular-nums; }
.t-number-large { font: 900 1.294rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; }
.t-week-number { font: 900 1.176rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; }
.t-display-number { font: 900 2rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; }
.t-headnote { font: italic 400 1.176rem/1.4 var(--font-serif); }
.t-footnote { font: 400 .765rem/1.38 var(--font-text); }
.t-caption { font: 600 .706rem/1.25 var(--font-text); }
.t-mono { font: 400 .706rem/1.35 var(--font-mono); }
.c-ink { color: var(--ink); } .c-2 { color: var(--text-2); } .c-3 { color: var(--text-3); }
.c-fresh { color: var(--fresh); } .c-today { color: var(--today-text); } .c-soon { color: var(--soon-text); } .c-beet { color: var(--beet-text); } .c-past { color: var(--past); } .c-frost { color: var(--frost); }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; min-width: 0; }
.hstack { display: flex; align-items: center; gap: 12px; }
.vstack { display: flex; flex-direction: column; gap: 12px; }

/* ===== Page chrome ===== */
.app { max-width: 480px; margin: 0 auto; padding: 0 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
.app.has-bar { padding-bottom: calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom, 0px)); }
.page { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.nav { padding-top: 4px; }
.nav-row { display: flex; justify-content: space-between; align-items: center; min-height: 48px; gap: 8px; margin: 0 -10px; }
.nav-side { display: flex; align-items: center; gap: 0; min-width: 0; }
.nav h1 { font: 700 2rem/1.12 var(--font-text); letter-spacing: -.005em; margin: 0 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
.nav.inline h1 { display: none; }
.tb { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--beet-text); font: 400 1rem var(--font-text); padding: 0 10px; border-radius: 999px; white-space: nowrap; }
.tb svg.i { width: 24px; height: 24px; }
.tb.back { padding-left: 4px; gap: 2px; }
.tb.strong { font-weight: 600; }
.tb:active { opacity: .6; }
.tb:disabled { color: var(--text-3); opacity: .55; }
.tb-add .disc { width: 32px; height: 32px; border-radius: 50%; background: var(--beet); color: var(--on-beet); display: grid; place-items: center; }
.tb-add .disc svg.i { width: 18px; height: 18px; }
.chef-cap { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--beet-soft); color: var(--beet-strong); font: 700 .882rem/1.2 var(--font-text); }
.chef-cap svg.i { width: 1.05em; height: 1.05em; }
.search-wrap { position: relative; }
.search-wrap > svg.i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-3); pointer-events: none; }
.search { width: 100%; min-height: 40px; border: 0; border-radius: 12px; background: var(--fill); padding: 8px 12px 8px 36px; font: 400 1rem var(--font-text); color: var(--ink); -webkit-appearance: none; appearance: none; }
.search::placeholder { color: var(--text-3); }
.search::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ===== Surfaces ===== */
.card { background: var(--surface); border-radius: 22px; padding: 16px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card.tight { padding: 12px; border-radius: 14px; }
.list { --inset: 68px; }
.list > .li { position: relative; }
.list > .li + .li::before { content: ""; position: absolute; top: 0; left: var(--inset); right: 0; border-top: .5px solid var(--separator); pointer-events: none; }
.crate { background: var(--cf); color: var(--co); }
.soft { background: var(--cs); color: var(--cd); }
.sep { border: 0; border-top: .5px solid var(--separator); margin: 0; }
.footnote { font: 400 .765rem/1.38 var(--font-text); color: var(--text-3); margin: -4px 4px 0; }
.lede { display: flex; align-items: center; gap: 12px; }
.lede-tile { width: 44px; height: 44px; border-radius: 12px; background: var(--beet-soft); color: var(--beet-text); display: grid; place-items: center; flex: none; }
.lede-tile svg.i { width: 22px; height: 22px; }
.lede p { font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); }
.err-card { background: var(--today-soft); color: var(--today-text); border-radius: 22px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; font: 400 .882rem/1.35 var(--font-text); }
.err-card svg.i { margin-top: 1px; width: 1.1em; height: 1.1em; }
.notice { background: var(--beet-soft); color: var(--beet-strong); border-radius: 22px; padding: 14px 16px; font: 400 .882rem/1.35 var(--font-text); }

/* ===== Section header ===== */
.sh { display: flex; align-items: center; gap: 8px; margin: 12px 0 -4px; padding: 0 2px; min-width: 0; flex-wrap: wrap; }
.sh .sh-t { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.sh:first-child { margin-top: 0; }
.sh h2 { font: 800 1.176rem/1.25 var(--font-text); min-width: 0; overflow-wrap: anywhere; }
.sh .sh-ic { align-self: center; font-size: 1.1rem; color: var(--ic, var(--text-2)); display: inline-flex; }
.sh .tile { align-self: center; }
.sh .count { font: 700 .765rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; color: var(--text-2); }
.sh .sh-trail { margin-left: auto; align-self: center; display: inline-flex; align-items: center; }
.sh .sh-action { margin-left: auto; align-self: center; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: flex-end; color: var(--beet-text); font: 600 .882rem/1.2 var(--font-text); padding: 0 2px; margin-block: -10px; }

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 8px 20px; border-radius: 999px; font: 700 1rem/1.2 var(--font-text); text-align: center; transition: transform .2s cubic-bezier(.2,.9,.3,1.2), background-color .2s, color .2s; -webkit-user-select: none; user-select: none; }
.btn svg.i { width: 1.1em; height: 1.1em; }
.btn.compact { min-height: 44px; padding: 8px 16px; font-size: .882rem; }
.btn.full { width: 100%; }
.btn.flex { flex: 1 1 auto; }
.btn.primary { background: var(--beet); color: var(--on-beet); }
.btn.primary:active:not(:disabled) { background: var(--beet-pressed); }
.btn.secondary { background: var(--beet-soft); color: var(--beet-strong); }
.btn.neutral { background: var(--fill); color: var(--ink); }
.btn.neutral:active:not(:disabled) { background: var(--fill-strong); }
.btn.danger { background: var(--today-soft); color: var(--today-text); }
.btn.inverted { background: var(--ticket-button); color: var(--on-ticket-button); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { background: var(--fill); color: var(--text-3); }
.btn.done:disabled { background: var(--beet-soft); color: var(--beet-strong); }
.btn.primary.done:disabled { background: var(--beet); color: var(--on-beet); }
.btn .lbl { display: inline-flex; align-items: center; gap: 8px; }
.btn.done .lbl { animation: swap .28s cubic-bezier(.2,.9,.3,1.2); }
.quiet { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 4px; color: var(--q, var(--text-2)); font: 600 .882rem/1.2 var(--font-text); transition: opacity .15s; }
.quiet svg.i { width: 1.05em; height: 1.05em; }
.quiet:active:not(:disabled) { opacity: .6; }
.quiet:disabled { opacity: .45; }
.icon-circle { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--fill); color: var(--ink); transition: transform .2s; }
.icon-circle svg.i { width: 20px; height: 20px; }
.icon-circle.beet { background: var(--beet); color: var(--on-beet); }
.icon-circle.beet-soft { background: var(--beet-soft); color: var(--beet-strong); }
.icon-circle.d50 { width: 50px; height: 50px; }
.icon-circle:active:not(:disabled) { transform: scale(.94); }
.icon-circle:disabled { background: var(--fill-strong); color: var(--text-3); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.actions .spacer { flex: 1 1 0; min-width: 0; }
.actions .push { margin-left: auto; }
.hero .actions .btn.primary { flex: 1 1 auto; }
.pick .actions .push { order: 3; flex: 1 0 auto; justify-content: flex-end; }

/* ===== Chips ===== */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips.inset0 { margin: 0; padding: 0; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; gap: 0 8px; }
.chips.wrap .chip { max-width: 100%; }
.chips.wrap .chip > span { white-space: normal; text-align: left; border-radius: 18px; }
.chip { flex: none; min-height: 44px; padding: 4px 0; display: inline-flex; align-items: center; }
.chip > span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--fill); color: var(--ink); font: 600 .882rem/1.2 var(--font-text); white-space: nowrap; transition: background-color .28s cubic-bezier(.2,.9,.3,1), color .28s; }
.chip[aria-pressed="true"] > span { background: var(--beet); color: var(--on-beet); font-weight: 700; }
.chip .ct { font: 700 .765rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; opacity: .85; }
.chip svg.i { width: 1em; height: 1em; }
.chip:active > span { transform: scale(.97); }
.capsules { display: flex; flex-wrap: wrap; gap: 6px; }
.capsules:empty { display: none; }
.capsule { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; background: var(--fill); color: var(--text-2); font: 600 .765rem/1.2 var(--font-text); white-space: nowrap; }
.capsules.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
.capsules.scroll::-webkit-scrollbar { display: none; }

/* ===== Freshness tag (date tape) ===== */
.tagw { display: inline-flex; flex: none; }
.tagw.soon { filter: var(--tape-filter); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; font: 700 .765rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.tag svg.i { width: 1em; height: 1em; }
.tag.sm { padding: 3px 8px; }
.tag.today, .tag.soon { clip-path: polygon(0 0,100% 0,calc(100% - 3px) 16.6%,100% 33.3%,calc(100% - 3px) 50%,100% 66.6%,calc(100% - 3px) 83.3%,100% 100%,0 100%,3px 83.3%,0 66.6%,3px 50%,0 33.3%,3px 16.6%); }
.tag.today { background: var(--today); color: var(--on-today); }
.tag.soon { background: var(--soon); color: var(--on-soon); }
.tag.fresh { color: var(--fresh); padding-inline: 0; }
.tag.paused { color: var(--frost); padding-inline: 0; }
.tag.past { color: var(--past); box-shadow: inset 0 0 0 1.25px var(--past); border-radius: 4px; }
.tag.none { color: var(--text-3); padding-inline: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--m, var(--fill-strong)); flex: none; display: inline-block; }
.dot.sm { width: 6px; height: 6px; }
.dot.past { background: none; box-shadow: inset 0 0 0 1.5px var(--past); }
.dot.m-none { box-shadow: inset 0 0 0 1px var(--text-3); }
.bar i.m-none { box-shadow: inset 0 0 0 1px var(--separator); }
.m-today { --m: var(--today); } .m-soon { --m: var(--soon); } .m-fresh { --m: var(--fresh); } .m-paused { --m: var(--frost); } .m-past { --m: var(--past); } .m-none { --m: var(--fill-strong); } .m-quiet { --m: var(--text-3); }

/* ===== Category tiles ===== */
.tile { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 11px; background: var(--cs); color: var(--cd); }
.tile svg.i { width: 18px; height: 18px; }
.tile.s { width: 28px; height: 28px; border-radius: 8px; }
.tile.s svg.i { width: 13px; height: 13px; }
.tile.l { width: 56px; height: 56px; border-radius: 16px; }
.tile.l svg.i { width: 25px; height: 25px; }
.tile.xl { width: 64px; height: 64px; border-radius: 18px; }
.tile.xl svg.i { width: 29px; height: 29px; }
.tile.crate { background: var(--cf); color: var(--co); box-shadow: var(--lf, none); }
.tile.dim { opacity: .5; }
.tile.just-in svg.i { animation: swap .28s cubic-bezier(.2,.9,.3,1.2); }
.fan { display: flex; align-items: center; padding: 6px 0 6px 4px; }
.fan .tile + .tile { margin-left: -20px; }
.fan.small .tile + .tile { margin-left: -9px; }
.fan .tile:nth-child(1) { transform: rotate(-8deg); }
.fan .tile:nth-child(2) { transform: rotate(4deg); }
.fan .tile:nth-child(3) { transform: rotate(12deg); }

/* ===== Food row & chip ===== */
.frow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; width: 100%; text-align: left; color: var(--ink); }
.frow.btnrow:active { background: var(--fill); }
.frow .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.frow .nm { font: 600 1rem/1.3 var(--font-text); overflow-wrap: anywhere; }
.frow .raw { font: 400 .706rem/1.35 var(--font-mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .dt { font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); overflow-wrap: anywhere; }
.frow.dim .nm, .frow.dim .dt { color: var(--text-2); }
.frow.dim .tile { opacity: .5; }
.frow.dim .tagw { visibility: hidden; }
.frow.lead { grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px 10px; padding-left: 2px; }
.frow.lead .check { margin-right: -6px; }
.arrive > .frow { animation: bubble-in .3s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(var(--i, 0) * 30ms); }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--surface); white-space: nowrap; color: var(--ink); transition: transform .28s cubic-bezier(.2,.9,.3,1.2); }
.fchip:active { transform: scale(.97); }
.fchip .nm { font: 600 .882rem/1.2 var(--font-text); }
.fchip.more { padding: 6px 14px; font: 600 .882rem/1.2 var(--font-text); background: var(--fill); }
.strip-scroll { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding: 0 16px; }
.strip-scroll > * { scroll-snap-align: start; }
.strip-scroll::-webkit-scrollbar { display: none; }

/* ===== Freshness strip ===== */
.fstrip { display: flex; flex-direction: column; gap: 12px; }
.fstrip-head { display: flex; align-items: center; gap: 8px; font: 800 1.176rem/1.25 var(--font-text); color: var(--ink); text-align: left; min-height: 30px; }
.fstrip-head svg.i { color: var(--fresh); }
button.fstrip-head:active { opacity: .7; }
.bar { display: flex; gap: 3px; height: 12px; border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 10px; border-radius: 3px; background: var(--m); transition: flex-grow .4s cubic-bezier(.3,.7,.3,1), opacity .2s; }
.bar i.past { background: none; box-shadow: inset 0 0 0 1.5px var(--past); }
.bar.filtered i:not(.sel) { opacity: .35; }
.bar.mini { height: 8px; }
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4px; margin: -4px -8px -6px; }
.legend-grid.row { display: flex; flex-wrap: wrap; }
.legend { min-height: 44px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; text-align: left; min-width: 0; transition: background-color .28s; }
.legend .nl { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; }
.legend .n { font: 800 1rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; color: var(--ink); }
.legend .l { font: 400 .882rem/1.2 var(--font-text); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend[aria-pressed="true"] { background: var(--fill); }
.legend.paused[aria-pressed="true"] { background: var(--frost-soft); }
.legend:active { background: var(--fill); }

/* ===== Dial ===== */
.dial { display: block; flex: none; }
.dial .arc { animation: dial-in .7s cubic-bezier(.3,.7,.3,1) both; }
.dial text { font-family: var(--font-rounded); font-variant-numeric: tabular-nums; }

/* ===== Coverage ===== */
.ready { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: var(--fresh-soft); color: var(--fresh); font: 700 .765rem/1 var(--font-rounded); white-space: nowrap; flex: none; }
.cov { display: inline-flex; align-items: center; gap: 6px; font: 700 .765rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; flex: none; }
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 6px; height: 12px; border-radius: 2px; background: var(--fill-strong); }
.meter i.on { background: var(--fresh); }
.meter.long { width: 48px; height: 6px; border-radius: 999px; background: var(--fill-strong); overflow: hidden; }
.meter.long i { height: 100%; width: var(--w); background: var(--fresh); border-radius: 0; }

/* ===== Stickers ===== */
.sticker { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); color: var(--ink); box-shadow: var(--sticker-shadow); font: 700 .765rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; white-space: nowrap; transform: rotate(var(--r, 0deg)); flex: none; }
.sticker svg.i { color: var(--ic, var(--text-2)); }
.stickers { display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: center; }
.time-sticker { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); color: var(--ink); box-shadow: var(--sticker-shadow); display: grid; place-content: center; text-align: center; --r: 6deg; transform: rotate(var(--r)); flex: none; }
.time-sticker b { font: 900 1.294rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; }
.time-sticker small { font: 700 .765rem/1 var(--font-rounded); color: var(--text-2); margin-top: 1px; }
.pop { animation: pop .45s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--i, 0) * 50ms); }

/* ===== Tonight ===== */
.dateline { font: 600 .882rem/1.35 var(--font-text); color: var(--text-2); margin-top: -6px; }
.ticket { color: var(--on-beet); display: flex; flex-direction: column; }
.ticket.in { animation: ticket-in .4s cubic-bezier(.2,.9,.3,1) both; transform-origin: top center; }
.ticket-top, .ticket-bottom { background: var(--beet); }
.ticket-top { border-radius: 28px 28px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 6px;
  -webkit-mask: radial-gradient(circle 10px at 0 100%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 10px at 100% 100%, transparent 98%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 10px at 0 100%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 10px at 100% 100%, transparent 98%, #000) right / 51% 100% no-repeat; }
.ticket-bottom { border-radius: 0 0 28px 28px; padding: 14px 20px 20px; position: relative;
  -webkit-mask: radial-gradient(circle 10px at 0 0, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 10px at 100% 0, transparent 98%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 10px at 0 0, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 10px at 100% 0, transparent 98%, #000) right / 51% 100% no-repeat; }
.ticket-bottom::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: 1.5px dashed rgba(255,255,255,.55); }
.ticket .eyebrow { color: var(--on-beet-2); }
.ticket .meta { color: var(--on-beet-2); font: 400 .882rem/1.35 var(--font-text); }
.ticket .t-hero { overflow-wrap: anywhere; }
.ticket .actions .quiet { --q: var(--on-beet); }
.ticket .actions .quiet.dim { --q: var(--on-beet-2); }
.hero { border-radius: 28px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; transition: transform .22s ease, opacity .22s ease; }
.hero-block { display: flex; flex-direction: column; gap: 14px; width: 100%; padding: 20px; text-align: left; }
.hero-block:active { filter: brightness(.97); }
.hero-top { display: flex; align-items: flex-start; gap: 12px; }
.hero-top .t-hero { overflow-wrap: anywhere; }
.hero-body { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.reason { display: flex; gap: 8px; align-items: flex-start; font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); }
.reason svg.i { margin-top: 1px; width: 1.05em; height: 1.05em; flex: none; }
.cov-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cov-line .need { font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); min-width: 0; }
.cov-line .fav { margin-left: auto; color: var(--beet-text); display: inline-flex; }
.pick { display: flex; flex-direction: column; gap: 12px; transition: transform .22s ease, opacity .22s ease; }
.pick-main { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; color: var(--ink); }
.pick-main .vstack { gap: 6px; }
.pick-title { display: flex; gap: 6px; align-items: baseline; }
.pick-title .fav { color: var(--beet-text); display: inline-flex; align-self: center; }
.removing { transform: translateX(-24px); opacity: 0; }
.chef-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; color: var(--ink); }
.chef-card:active { opacity: .8; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--beet-soft); color: var(--beet-text); display: grid; place-items: center; flex: none; }
.avatar svg.i { width: 20px; height: 20px; }
.avatar.sm { width: 28px; height: 28px; }
.avatar.sm svg.i { width: 14px; height: 14px; }
.chev { color: var(--text-3); display: inline-flex; flex: none; }
.chev svg.i { width: 18px; height: 18px; }
.calm { display: flex; gap: 8px; align-items: flex-start; font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); padding: 0 2px; }
.calm svg.i { color: var(--fresh); margin-top: 2px; }

/* ===== Empty state ===== */
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 24px 4px; }
.empty h2 { font: 800 1.294rem/1.2 var(--font-text); color: var(--ink); }
.empty p { font: 400 1rem/1.42 var(--font-text); color: var(--text-2); max-width: 34ch; }
.empty .btn { align-self: stretch; }
.steps { list-style: none; margin: 0; padding: 0; width: 100%; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: .5px solid var(--separator); }
.steps li:first-child { border-top: 0; }
.steps .n { font: 900 1.294rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; color: var(--beet-text); min-width: 24px; }
.steps .tx { flex: 1; min-width: 0; font: 400 1rem/1.42 var(--font-text); }

/* ===== Fridge ===== */
.atiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.atiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.atile { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; min-height: 76px; padding: 12px; border-radius: 14px; background: var(--surface); text-align: left; color: var(--ink); }
.atile svg.i { width: 22px; height: 22px; color: var(--beet-text); }
.atile span { font: 600 .706rem/1.25 var(--font-text); }
.atile:active { transform: scale(.97); }
.checkin-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; color: var(--ink); }
.checkin-card .fan { padding: 4px 6px 4px 2px; }
.checkin-card .go { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--beet); color: var(--on-beet); font: 700 .882rem/1 var(--font-text); flex: none; }
.checkin-card:active .go { background: var(--beet-pressed); }

/* ===== Check toggle & switch ===== */
.check { width: 44px; height: 44px; display: inline-grid; place-items: center; flex: none; color: var(--text-3); }
.check svg.i { width: 26px; height: 26px; }
.check.on { color: var(--beet); }
.just .check.on svg.i, .check.on.just svg.i { animation: swap .28s cubic-bezier(.2,.9,.3,1.2); }
.switch { display: inline-block; margin: 0; width: 51px; height: 31px; border-radius: 999px; background: var(--fill-strong); position: relative; flex: none; cursor: pointer; transition: background-color .28s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.18); transition: transform .28s cubic-bezier(.2,.9,.3,1.1); }
input.switch, .field input.switch { -webkit-appearance: none; appearance: none; flex: none; width: 51px; height: 31px; padding: 0; border-radius: 999px; background: var(--fill-strong); }
.switch:checked, .switch.on, .field input.switch:checked { background: var(--beet); }
.switch:checked::after, .switch.on::after { transform: translateX(20px); }
.switch:disabled, .switch.off-dim { opacity: .45; }
.toggle-row { display: flex; align-items: center; gap: 12px; min-height: 52px; width: 100%; text-align: left; color: var(--ink); }
.toggle-row .grow { font: 400 1rem/1.3 var(--font-text); }

/* ===== Recipes ===== */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rtile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 150px; padding: 14px; border-radius: 22px; text-align: left; width: 100%; min-width: 0; transition: transform .2s; }
.rtile:active { transform: scale(.98); }
.rtile .top { display: flex; justify-content: space-between; width: 100%; font-size: 1.25rem; }
.rtile .push { flex: 1 1 12px; min-height: 12px; }
.rtile .t-tile-title { overflow-wrap: anywhere; }
.rtile .numtext .u { color: inherit; opacity: .92; }
.numtext { white-space: nowrap; }
.numtext .v { font: 800 1rem/1.2 var(--font-rounded); font-variant-numeric: tabular-nums; }
.numtext .u { font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); }
.rrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; width: 100%; text-align: left; color: var(--ink); }
.rrow:active { background: var(--fill); }
.rrow .ttl { display: flex; align-items: baseline; gap: 6px; }
.rrow .ttl .fav { color: var(--beet-text); display: inline-flex; align-self: center; font-size: .8rem; }
.rrow .sub { font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rrow .meter { gap: 1.5px; }
.rrow .meter i { width: 4px; }
.rrow .sub svg.i { color: var(--today-text); }

/* ===== Recipe detail ===== */
.rd-head { border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.rd-head .t-display { overflow-wrap: anywhere; }
.rd-head .stickers { margin-top: 6px; }
.ing { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 16px; width: 100%; text-align: left; color: var(--ink); }
button.ing:active { background: var(--fill); }
.ing .st { font-size: 1.3rem; line-height: 1; display: inline-flex; padding-top: 1px; }
.ing .trail { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
.ing .qty { font: 800 1rem/1.3 var(--font-rounded); font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.ing .added { display: inline-flex; align-items: center; gap: 4px; font: 600 .882rem/1.3 var(--font-text); color: var(--fresh); white-space: nowrap; animation: swap .28s cubic-bezier(.2,.9,.3,1.2); }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 14px 16px; }
.step .n { font: 900 1.294rem/1 var(--font-rounded); font-variant-numeric: tabular-nums; color: var(--beet-text); }
.step .tx { font: 400 1rem/1.42 var(--font-text); line-height: calc(1.42em + 3px); }

/* ===== Plan ===== */
.week-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.week-head .mid { text-align: center; }
.week-head .mid .t-tile-title { font-variant-numeric: tabular-nums; }
.week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.week-col { min-width: 0; min-height: 64px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 0 7px; color: var(--ink); }
.week-col .t-eyebrow { color: var(--text-2); letter-spacing: .04em; }
.week-col .dots { display: flex; gap: 3px; height: 6px; }
.week-col.today { background: var(--beet); color: var(--on-beet); }
.week-col.today .t-eyebrow { color: var(--on-beet-2); }
.week-col.today .dot { box-shadow: 0 0 0 1.5px var(--beet); }
.week-col.past-day { color: var(--text-3); }
.week-col:active { transform: scale(.96); }
.shop-card { background: var(--beet-soft); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.beet-tile { width: 44px; height: 44px; border-radius: 12px; background: var(--beet); color: var(--on-beet); display: grid; place-items: center; flex: none; }
.beet-tile svg.i { width: 22px; height: 22px; }
.beet-tile.r40 { width: 40px; height: 40px; border-radius: 11px; }
.day-head { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 -4px; padding: 0 2px; scroll-margin-top: 12px; }
.day-head .today-cap { align-self: center; display: inline-flex; padding: 4px 8px; border-radius: 999px; background: var(--beet); color: var(--on-beet); font: 700 .765rem/1 var(--font-rounded); }
.day-head.past-day { color: var(--text-3); }
.meal { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px; padding-right: 8px; }
.meal-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 0 10px 16px; min-height: 64px; text-align: left; color: var(--ink); width: 100%; }
.meal-main:active { opacity: .7; }
.meal-main .t-eyebrow { color: var(--text-2); }
.meal .x { font: 700 .765rem/1 var(--font-rounded); color: var(--text-2); font-variant-numeric: tabular-nums; }
.add-meal { display: flex; align-items: center; justify-content: flex-start; gap: 6px; padding: 0 16px; width: 100%; min-height: 48px; border-radius: 14px; border: 1.5px dashed var(--fill-strong); color: var(--text-2); font: 600 .882rem/1.2 var(--font-text); }
.add-meal:active { background: var(--fill); }
.add-row { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; color: var(--beet-text); font: 600 .882rem/1.2 var(--font-text); width: 100%; text-align: left; }

/* ===== Shopping ===== */
.shop-add { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; }
.shop-add input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 0; font: 400 1rem var(--font-text); outline: none; }
.shop-add input::placeholder { color: var(--text-3); }
.srow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 52px; padding: 4px 16px 4px 4px; width: 100%; text-align: left; color: var(--ink); }
.srow:active { background: var(--fill); }
.srow .nm { font: 600 1rem/1.3 var(--font-text); overflow-wrap: anywhere; transition: color .28s; }
.srow .why { font: 400 .765rem/1.38 var(--font-text); color: var(--text-2); }
.srow .q { font: 700 .765rem/1 var(--font-rounded); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.srow.on .nm { text-decoration: line-through; text-decoration-color: var(--text-2); color: var(--text-2); }

/* ===== Chef ===== */
.context { display: flex; gap: 8px; align-items: flex-start; font: 400 .765rem/1.38 var(--font-text); color: var(--text-2); }
.context svg.i { color: var(--beet-text); margin-top: 1px; }
.prompt { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px; border-radius: 14px; background: var(--surface); width: 100%; text-align: left; color: var(--ink); font: 400 1rem/1.35 var(--font-text); }
.prompt:active { transform: scale(.98); }
.prompt .gt { width: 28px; height: 28px; border-radius: 8px; background: var(--beet-soft); color: var(--beet-text); display: grid; place-items: center; flex: none; }
.prompt .gt svg.i { width: 14px; height: 14px; }
.chat { display: flex; flex-direction: column; gap: 12px; }
.bubble { padding: 10px 14px; max-width: 85%; overflow-wrap: anywhere; font: 400 1rem/1.42 var(--font-text); }
.bubble.user { align-self: flex-end; background: var(--beet); color: var(--on-beet); border-radius: 20px 20px 6px 20px; }
.bubble.user.new { animation: bubble-in .28s cubic-bezier(.2,.9,.3,1) both; }
.bubble.bot { background: var(--surface); color: var(--ink); border-radius: 20px 20px 20px 6px; -webkit-user-select: text; user-select: text; }
.bubble.bot ul, .bubble.bot ol { margin: 6px 0; padding-left: 20px; }
.bubble.bot p { margin: 0 0 6px; }
.bubble.bot p:last-child { margin-bottom: 0; }
.bot-turn { display: flex; gap: 8px; align-items: flex-start; max-width: 100%; }
.bot-turn .col { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; max-width: calc(85% + 36px); }
.bot-turn .bubble { max-width: 100%; }
.thinking { display: inline-flex; align-items: center; gap: 8px; font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); padding: 4px 0; }
.thinking .dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-right: 3px; animation: blink 1.2s infinite both; }
.thinking .dots i:nth-child(2) { animation-delay: .2s; } .thinking .dots i:nth-child(3) { animation-delay: .4s; }
.composer { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 10px 16px 8px; background: var(--canvas); border-top: .5px solid var(--separator); }
.composer-inner { max-width: 448px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: var(--fill); border-radius: 22px; padding: 11px 16px; max-height: 132px; min-height: 44px; font: 400 1rem/1.35 var(--font-text); outline: none; }
.composer textarea::placeholder { color: var(--text-3); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }

/* ===== Action bar (page + sheet) ===== */
.pagebar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 10px 16px 8px; background: var(--canvas); border-top: .5px solid var(--separator); }
.pagebar-inner { max-width: 448px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .pagebar, .composer, .tabbar, .sheet-bar { background: color-mix(in srgb, var(--canvas) 82%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px); }
  /* Stacked bars stay solid so content never reads through two layers. */
  .pagebar, .sheet-bar, .app.has-bar ~ .tabbar { background: var(--canvas); }
}

/* ===== Tab bar ===== */
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--canvas); border-top: .5px solid var(--separator); padding-bottom: env(safe-area-inset-bottom, 0px); }
.app.has-bar ~ .tabbar { border-top-color: transparent; }
.tabbar-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-2); font: 500 .647rem/1 var(--font-text); letter-spacing: .01em; }
.tab .ico { position: relative; display: inline-flex; }
.tab svg.i { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--beet-text); font-weight: 600; }
.tab .badge { position: absolute; top: -4px; left: 17px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--today); color: var(--on-today); font: 800 .706rem/18px var(--font-rounded); text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--canvas); }

/* ===== Sheets ===== */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); animation: fade .25s ease both; }
.sheet { position: relative; width: min(100%, 480px); max-height: calc(100vh - 36px); max-height: calc(100dvh - 36px); background: var(--canvas); border-radius: 32px 32px 0 0; display: flex; flex-direction: column; animation: rise .32s cubic-bezier(.2,.9,.3,1) both; overflow: hidden; }
.sheet-wrap.still .sheet, .sheet-wrap.still .sheet-backdrop { animation: none; }
.sheet.tall { height: calc(100vh - 36px); height: calc(100dvh - 36px); }
.sheet::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--fill-strong); z-index: 2; }
.sheet-head { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; padding: 16px 6px 4px; min-height: 60px; flex: none; }
.sheet-head h2 { font: 600 1rem/1.2 var(--font-text); text-align: center; max-width: 58vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head .left { justify-self: start; display: flex; }
.sheet-head .right { justify-self: end; display: flex; }
.sheet-body { overflow-y: auto; padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0; }
.sheet-body > *, .page > *, .sheet-body form.vstack > * { flex-shrink: 0; }
.sheet-bar { flex: none; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--canvas); border-top: .5px solid var(--separator); display: flex; flex-direction: column; gap: 8px; }
.sheet-bar .row2 { display: flex; gap: 10px; }
.dialog { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; background: var(--backdrop); animation: fade .2s ease both; }
.dialog .panel { background: var(--surface); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; animation: rise .28s cubic-bezier(.2,.9,.3,1) both; }
.dialog .panel h3 { font: 600 .882rem/1.35 var(--font-text); color: var(--text-2); text-align: center; padding: 4px 0 6px; }

/* Forms inside sheets */
.field { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px; }
.field > label { flex: none; color: var(--ink); font: 400 1rem/1.3 var(--font-text); }
.field input, .field select { flex: 1; min-width: 0; border: 0; background: none; padding: 6px 0; text-align: right; font: 400 1rem var(--font-text); color: var(--ink); outline: none; }
.field input[type="date"] { text-align: right; min-height: 34px; }
.field .unit { color: var(--text-2); }
.field.stack { flex-direction: column; align-items: stretch; gap: 6px; padding: 12px 16px; }
.field.stack > label { color: var(--text-2); font: 400 .882rem/1.35 var(--font-text); }
.field textarea, .area { width: 100%; border: 0; background: none; resize: vertical; min-height: 110px; font: 400 1rem/1.42 var(--font-text); color: var(--ink); padding: 0; outline: none; }
.field input::placeholder, .field textarea::placeholder, .area::placeholder, .bare::placeholder { color: var(--text-3); }
.bare { border: 0; background: none; outline: none; width: 100%; min-width: 0; padding: 4px 0; color: var(--ink); }
.name-field { font: 800 1.294rem/1.2 var(--font-text); }
.headnote-field { font: italic 400 1.176rem/1.4 var(--font-serif); resize: none; }
.num-field { font: 800 1rem/1.2 var(--font-rounded) !important; font-variant-numeric: tabular-nums; }
.mini-stepper { display: inline-flex; align-items: center; gap: 8px; }
.mini-stepper input { width: 3.2ch; text-align: center; flex: none; }
.label-sm { font: 600 .882rem/1.35 var(--font-text); color: var(--text-2); padding: 0 2px; }
.loc-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.loc-tile { min-height: 64px; border-radius: 14px; background: var(--fill); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 .882rem/1.2 var(--font-text); transition: background-color .28s, color .28s; }
.loc-tile svg.i { width: 22px; height: 22px; }
.loc-tile[aria-pressed="true"] { background: var(--beet); color: var(--on-beet); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px 6px; }
.cat-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px 6px; border-radius: 16px; text-align: center; color: var(--ink); min-width: 0; }
.cat-opt .t-caption { overflow-wrap: anywhere; }
.cat-opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--beet); }
.exp-live { display: flex; align-items: center; gap: 14px; }
.stepper { display: flex; align-items: center; gap: 16px; }
.stepper .val { text-align: center; min-width: 3.4em; }
.stepper .val .t-display-number { display: block; }
.receipt-thumbs { position: relative; width: 150px; height: 190px; flex: none; }
.receipt-thumbs img, .receipt-thumbs .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 6px solid #fff; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.receipt-thumbs .ph { background: repeating-linear-gradient(#fff 0 10px, #eef0ef 10px 12px); }
.scanband { position: absolute; left: 6px; right: 6px; top: 6px; height: 3px; background: linear-gradient(90deg, transparent, var(--beet), transparent); animation: scan 1.6s ease-in-out infinite alternate; z-index: 3; border-radius: 2px; }
.photo { position: relative; border-radius: 22px; overflow: hidden; max-height: 280px; background: var(--fill); }
.photo img { display: block; width: 100%; max-height: 280px; object-fit: cover; }
.photo .scanband { left: 0; right: 0; top: 0; }
.big-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big-tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 120px; padding: 16px; border-radius: 22px; background: var(--surface); color: var(--ink); cursor: pointer; }
.big-tile:active { transform: scale(.98); }
.tips { display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.tip { display: flex; align-items: center; gap: 12px; font: 400 .882rem/1.35 var(--font-text); color: var(--text-2); }
.tip .tt { width: 28px; height: 28px; border-radius: 8px; background: var(--fill); color: var(--text-2); display: grid; place-items: center; flex: none; }
.tip .tt svg.i { width: 14px; height: 14px; }
.figures { display: flex; gap: 24px; align-items: flex-end; }
.figures .t-display-number { display: block; }
details.skipped summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 44px; cursor: pointer; font: 400 1rem/1.3 var(--font-text); }
details.skipped summary::-webkit-details-marker { display: none; }
details.skipped summary svg.i { color: var(--text-3); transition: transform .28s; }
details.skipped[open] summary svg.i { transform: rotate(90deg); }
details.skipped .lines { display: flex; flex-direction: column; gap: 6px; padding: 2px 0 8px; }
.menu-row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; width: 100%; text-align: left; color: var(--ink); }
.menu-row:active { background: var(--fill); }
.menu-row .mt { width: 29px; height: 29px; border-radius: 7px; background: var(--beet-soft); color: var(--beet-text); display: grid; place-items: center; flex: none; }
.menu-row .mt svg.i { width: 15px; height: 15px; }
.menu-row.danger { color: var(--today-text); }
.menu-row.danger .mt { background: var(--today-soft); color: var(--today-text); }
.menu-row:disabled { opacity: .45; }
.set-head { display: flex; align-items: center; gap: 10px; margin: 12px 2px -4px; font: 600 .882rem/1.2 var(--font-text); color: var(--text-2); }
.set-head:first-child { margin-top: 0; }
.set-tile { width: 29px; height: 29px; border-radius: 7px; background: var(--beet-soft); color: var(--beet-text); display: grid; place-items: center; flex: none; }
.set-tile svg.i { width: 15px; height: 15px; }
.legend-rows .lr { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 48px; padding: 6px 16px; }
.plain-row { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 16px; width: 100%; text-align: left; color: var(--beet-text); font: 400 1rem/1.3 var(--font-text); }
.plain-row:active { background: var(--fill); }
.plain-row.danger { color: var(--today-text); }

/* Check-in */
.ci-progress { display: flex; align-items: center; gap: 10px; }
.ci-progress .segs { flex: 1; display: flex; gap: 3px; }
.ci-progress .segs i { flex: 1; height: 4px; border-radius: 99px; background: var(--fill-strong); transition: background-color .28s; }
.ci-progress .segs i.kept { background: var(--fresh); } .ci-progress .segs i.used { background: var(--text-2); } .ci-progress .segs i.tossed { background: var(--today); } .ci-progress .segs i.cur { background: var(--beet); }
.ci-progress .bar-line { flex: 1; height: 4px; border-radius: 99px; background: var(--fill-strong); overflow: hidden; }
.ci-progress .bar-line i { display: block; height: 100%; background: var(--beet); }
.ci-deck { position: relative; isolation: isolate; margin: auto 0; padding-bottom: 20px; }
.ci-deck .peek { position: absolute; inset: 0 0 20px; border-radius: 32px; background: var(--cf); transform-origin: 50% 100%; }
.ci-deck .peek.p1 { transform: translateY(10px) scale(.95); z-index: -1; opacity: .9; }
.ci-deck .peek.p2 { transform: translateY(20px) scale(.9); z-index: -2; opacity: .75; }
.ci-card { position: relative; border-radius: 32px; padding: 24px; min-height: 300px; display: flex; flex-direction: column; gap: 14px; transition: transform .2s ease-in, opacity .2s ease-in; }
.ci-card.enter { animation: card-in .3s cubic-bezier(.2,.9,.3,1) both; }
.ci-card.exit-right { transform: translateX(115%) rotate(8deg); opacity: 0; }
.ci-card.exit-left { transform: translateX(-115%) rotate(-8deg); opacity: 0; }
.ci-card.exit-up { transform: translateY(-40%) scale(.85); opacity: 0; }
.ci-card .t-display { overflow-wrap: anywhere; }
.ci-card .eyebrow { display: inline-flex; align-items: center; gap: 6px; }
.ci-card .dial-row { display: flex; align-items: center; gap: 16px; }
.ci-card .numtext .u { color: inherit; opacity: .9; }
.ci-card .t-footnote { opacity: .95; }
.stamp { position: absolute; top: 20px; right: 16px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 3px solid currentColor; font: 800 1.176rem/1.1 var(--font-text); letter-spacing: .04em; transform: rotate(-8deg); box-shadow: var(--sticker-shadow); animation: stamp .45s cubic-bezier(.3,1.5,.5,1) both; z-index: 2; }
.stamp.kept { color: var(--fresh); } .stamp.used { color: var(--ink); } .stamp.tossed { color: var(--today-text); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-radius: 22px; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--fill); min-width: 0; }
.stats.anim .t-display-number { animation: pop .45s cubic-bezier(.3,1.5,.5,1) both; }
.stat .t-detail-strong { color: var(--ink); }
.stat.kept { background: var(--fresh-soft); } .stat.kept .t-display-number { color: var(--fresh); }
.stat.tossed { background: var(--today-soft); } .stat.tossed .t-display-number { color: var(--today-text); }
.waste { display: flex; flex-direction: column; gap: 8px; }
.waste .wbar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; gap: 2px; }
.waste .wbar i { display: block; height: 100%; }
.lvl { width: 64px; height: 6px; border-radius: 999px; background: var(--fill-strong); overflow: hidden; }
.lvl i { display: block; height: 100%; background: var(--fresh); border-radius: 999px; transition: width .4s cubic-bezier(.3,.7,.3,1); }
.pen { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pen s { text-decoration-color: var(--beet-text); text-decoration-thickness: 2px; color: var(--text-2); }
.pen .arrow { color: var(--text-3); display: inline-flex; }
.cook-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px 12px; align-items: start; padding: 10px 16px 12px 4px; }

  const count = o.count != null ? `<span class="count">${o.count}</span>` : "";
  const trail = o.actionTitle ? `<button type="button" class="sh-action" ${attrs(o.act || {})}>${esc(o.actionTitle)}</button>` : o.trail ? `<span class="sh-trail">${o.trail}</span>` : "";
  return `<div class="sh" ${o.id ? `id="${o.id}"` : ""}>${lead}<span class="sh-t"><h2>${esc(title)}</h2>${count}</span>${trail}</div>`;
}
const lede = (icon, text) => `<div class="lede"><span class="lede-tile" aria-hidden="true">${ic(icon)}</span><p>${esc(text)}</p></div>`;
const errCard = text => `<div class="err-card" role="alert">${ic("alertFill")}<span>${esc(text)}</span></div>`;
function emptyState(tiles, title, message, actions = []) {
  let acts = "";
  if (actions.some(a => a.step)) {
    acts = `<ol class="steps">${actions.map((a, i) => `<li><span class="n">${i + 1}</span><span class="tx">${esc(a.step)}</span>${btn(a.title, { ...a, kind: i ? "secondary" : "primary", size: "compact" })}</li>`).join("")}</ol>`;
  } else {
    acts = actions.map((a, i) => btn(a.title, { ...a, kind: i ? "secondary" : "primary", full: true })).join("");
  }
  return `<div class="empty">${tiles && tiles.length ? fan(tiles) : ""}<h2>${esc(title)}</h2>${message ? `<p>${esc(message)}</p>` : ""}${acts}</div>`;
}
const actionTile = (title, icon, o = {}) => `<button type="button" class="atile" ${attrs(o)}>${ic(icon)}<span>${esc(title)}</span></button>`;
const checkMark = on => `<span class="check ${on ? "on" : ""}" aria-hidden="true">${ic(on ? "checkFill" : "circle")}</span>`;
function stepper(value, unit, action) {
  return `<div class="stepper" role="group" aria-label="Servings"><button type="button" class="icon-circle" data-action="${action}" data-value="-1" aria-label="Fewer servings" ${value <= 1 ? "disabled" : ""}>${ic("minus")}</button><div class="val" aria-live="polite"><span class="t-display-number">${value}</span><span class="t-detail c-2">${esc(unit)}</span></div><button type="button" class="icon-circle" data-action="${action}" data-value="1" aria-label="More servings" ${value >= 48 ? "disabled" : ""}>${ic("plus")}</button></div>`;
}
function foodRowInner(o) {
  return `${tile(o.cat, "", "soft")}<span class="txt"><span class="nm clamp2">${esc(o.name)}</span>${o.rawText ? `<span class="raw">${esc(o.rawText)}</span>` : ""}${o.detail ? `<span class="dt">${esc(o.detail)}</span>` : ""}</span>${tag(o.st, o.loc, { estimated: o.estimated })}`;
}
const foodLabel = o => `${o.name}, ${o.detail ? o.detail + ", " : ""}${CATEGORY_TITLE[o.cat]}. ${o.estimated ? "About: " : ""}${spokenLabel(o.st, o.loc)}`;
function foodChip(it, o = {}) {
  const st = expiryStatus(it.expiresAt, soonDays());
  const target = o.value != null ? `data-value="${esc(o.value)}"` : `data-id="${esc(it.id)}"`;

}
function freshStrip(c, o = {}) {
  const segs = TONES.map(t => [t, countFor(c, t)]).filter(([, n]) => n > 0);
  const f = o.filter || null;
  let head = "";
  if (o.headline !== false) {
    const text = headlineOf(c);
    const leaf = text === "Everything's fresh" ? ic("leaf") : "";
    head = o.headAction
      ? `<button type="button" class="fstrip-head" data-action="${o.headAction}" aria-description="Shows items to use soon">${leaf}<span>${esc(text)}</span></button>`
      : `<h2 class="fstrip-head">${leaf}<span>${esc(text)}</span></h2>`;
  }
  const bar = `<div class="bar ${f ? "filtered" : ""} ${o.mini ? "mini" : ""}" aria-hidden="true">${segs.length
    ? segs.map(([t, n]) => `<i class="m-${t} ${t === "past" ? "past" : ""} ${t === f ? "sel" : ""}" style="flex:${n} 0 10px"></i>`).join("")
    : '<i class="m-none" style="flex:1 0 10px"></i>'}</div>`;
  const legend = o.legend === false || !segs.length ? "" : `<div class="legend-grid ${segs.length <= 2 ? "row" : ""}" role="group" aria-label="Freshness filters">${segs.map(([t, n]) =>
    `<button type="button" class="legend ${t}" data-action="tone-filter" data-value="${t}" aria-pressed="${t === f}" aria-label="${n} ${LEGEND_LABEL[t]}" aria-description="Filters the list">${toneDot(t)}<span class="nl"><span class="n">${n}</span><span class="l">${LEGEND_LABEL[t]}</span></span></button>`).join("")}</div>`;
  return `<div class="fstrip">${head}${bar}${legend}</div>`;
}
/** Kitchen-timer dial: dark face, 14-day arc (DESIGN.md §7.3). */
function dial(st, loc, size = "large") {
  const tone = toneOf(st, loc), large = size === "large";
  const S = large ? 168 : 64, c = S / 2, r = large ? 62 : 24, w = large ? 12 : 6;
  const f = dialFraction(st), [val, unit] = dialParts(st);
  const mark = { today: "var(--dial-today)", soon: "var(--dial-soon)", fresh: "var(--dial-fresh)", paused: "var(--dial-frost)", past: "var(--dial-past)", none: "var(--dial-track)" }[tone];
  let s = `<svg class="dial" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" aria-hidden="true" focusable="false"><circle cx="${c}" cy="${c}" r="${c}" fill="var(--dial-face)"/>`;
  if (!large) s += `<circle cx="${c}" cy="${c}" r="${c - 0.5}" fill="none" stroke="var(--separator)" stroke-width="1"/>`;
  if (large) for (let i = 0; i < 14; i++) s += `<rect x="${c - 1.5}" y="4" width="3" height="8" rx="1.5" fill="var(--dial-tick)" transform="rotate(${(i / 14 * 360).toFixed(2)} ${c} ${c})"/>`;
  s += tone === "past"
    ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--dial-past)" stroke-width="${w * 0.5}" stroke-dasharray="4 5"/>`
    : `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--dial-track)" stroke-width="${w}"/>`;
  if (f > 0) s += `<circle class="arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${mark}" stroke-width="${w}" stroke-linecap="round" pathLength="100" stroke-dasharray="${(f * 100).toFixed(1)} 100" transform="rotate(-90 ${c} ${c})"/>`;
  if (large) {
    const snow = tone === "paused";
    if (snow) s += `<g transform="translate(${c - 9} ${c - 46}) scale(.75)" color="#fff">${G.snow}</g>`;
    const vy = snow ? c + 12 : c + 7;
    s += `<text x="${c}" y="${vy}" text-anchor="middle" fill="#fff" font-size="${val.length > 2 ? 28 : 34}" font-weight="900">${esc(val)}</text>`;
    s += `<text x="${c}" y="${vy + 22}" text-anchor="middle" fill="rgba(255,255,255,.75)" font-size="13" font-weight="600" style="font-family:var(--font-text)">${esc(unit)}</text>`;
  } else {
    s += `<text x="${c}" y="${c + 6}" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">${esc(val)}</text>`;
  }
  return s + "</svg>";
}
function ticket(top, bottom, cls = "") {
  return `<section class="ticket ${cls}" aria-label="Tonight's dinner"><div class="ticket-top">${top}</div><div class="ticket-bottom">${bottom}</div></section>`;
}
function navBar(title, left = "", right = "", o = {}) {
  return `<header class="nav ${o.inline ? "inline" : ""}"><div class="nav-row"><div class="nav-side">${left}</div><div class="nav-side">${right}</div></div>${o.inline ? "" : `<h1>${esc(title)}</h1>`}</header>`;
}
const searchField = (id, bind, placeholder, value, attr = "data-bind") => `<div class="search-wrap">${ic("search")}<label for="${id}" class="visually-hidden">${esc(placeholder)}</label><input class="search" id="${id}" ${attr}="${bind}" type="search" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off"></div>`;

function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
  const out = [];
  let list = null;
  for (const raw of String(text).split("\n")) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/), num = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (bullet || num) {
      const type = bullet ? "ul" : "ol";
      if (!list || list.type !== type) { if (list) out.push(`</${list.type}>`); list = { type }; out.push(`<${type}>`); }
      out.push(`<li>${inline((bullet || num)[1])}</li>`);
      continue;
    }
    if (list) { out.push(`</${list.type}>`); list = null; }
    if (!line.trim()) continue;
    const h = line.match(/^#{1,6}\s+(.*)$/);
    out.push(h ? `<p><strong>${inline(h[1])}</strong></p>` : `<p>${inline(line)}</p>`);
  }
  if (list) out.push(`</${list.type}>`);
  return out.join("");
}

let toastTimer;
function toast(msg) {
  const root = document.getElementById("toast-root");
  root.innerHTML = msg ? `<div class="toast" role="status">${esc(msg)}</div>` : "";
  clearTimeout(toastTimer);
  if (msg) toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2600);
}
function announce(msg) {
  const el = document.getElementById("live");
  if (el) { el.textContent = ""; setTimeout(() => { el.textContent = msg; }, 30); }
}
let flashTimer;
/** Inline confirmation: the button that did it shows "✓ text" for 2 s (replaces success alerts). */
function flash(key, text) {
  ui.flash = { key, text };
  announce(text);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { ui.flash = null; render(); if (ui.sheet) renderSheet(); }, 2000);
}

// ---------- Views ----------
const CHEF_TONIGHT_PROMPT = "What should I make for dinner tonight? Use what's expiring first, and keep it realistic for a weeknight.";

function tonightView() {
  const sd = soonDays();
  const withSt = state.pantry.map(p => ({ p, st: expiryStatus(p.expiresAt, sd) }));
  const counts = freshCounts(withSt.map(x => ({ st: x.st, loc: x.p.location })));
  const dateLine = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const urgentCount = counts.byTomorrow + counts.soon;
  let body = `<p class="dateline" id="top">${esc(dateLine)}${urgentCount ? `<span class="${counts.byTomorrow ? "c-today" : "c-soon"}"> · ${esc(headlineOf(counts))}</span>` : ""}</p>`;

  const entry = tonightEntry();
  if (entry) {
    const r = recipeById(entry.recipeId);
    const total = mins(r);
    const rescue = rescueFor(r).slice(0, 2).map(x => x.p.name.toLowerCase());
    const meta = [total ? `${total} min` : "", rescue.length ? "uses " + rescue.join(", ") : ""].filter(Boolean).join(" · ");
    body += ticket(
      `<span class="t-eyebrow eyebrow">On for tonight · Serves ${entry.servings}</span><h2 class="t-hero">${esc(r.title)}</h2>${meta ? `<p class="meta">${esc(meta)}</p>` : ""}`,
      `<div class="actions">${btn("I cooked it", { kind: "inverted", icon: "pan", action: "tonight-cooked", id: entry.id })}${quiet("Recipe", { action: "open-recipe", id: r.id })}${quiet("Change", { icon: "swap", action: "tonight-change", id: entry.id, cls: "dim push", label: "Change tonight's dinner" })}</div>`,
      ui.ticketIn ? "in" : "");
    ui.ticketIn = false;
  }

  // Use soon: expiring by days, then past-date last.
  const urgent = withSt.filter(x => x.st.kind === "soon").sort((a, b) => a.st.days - b.st.days || a.p.name.localeCompare(b.p.name))
    .concat(withSt.filter(x => x.st.kind === "expired").sort((a, b) => a.st.days - b.st.days));
  if (urgent.length) {
    body += sh("Use soon", { count: urgent.length, icon: "timer", iconColor: "var(--today-text)", actionTitle: "Fridge", act: { action: "tab", value: "fridge", label: "Open the Fridge" } });
    body += `<div class="strip-scroll" role="group" aria-label="Use soon">${urgent.slice(0, 10).map(x => foodChip(x.p)).join("")}${urgent.length > 10 ? `<button type="button" class="fchip more" data-action="tab" data-value="fridge">+${urgent.length - 10} more</button>` : ""}</div>`;
  } else {
    const dated = withSt.filter(x => x.st.kind === "fresh").sort((a, b) => a.st.days - b.st.days);
    if (dated.length) {
      body += sh("Use soon", { icon: "timer", iconColor: "var(--text-2)" });
      body += `<p class="calm">${ic("leaf")}<span>Nothing on the clock. Next up: ${esc(dated[0].p.name)} in ${esc(shortLabel(dated[0].st).toLowerCase())}.</span></p>`;
    }
  }

  const skipped = tonightSkipped();
  const picks = tonightPicks(ui.tonightMax, skipped);
  if (state.recipes.length && state.pantry.length) {
    body += sh(entry ? "Other ideas" : "Tonight's picks");
    body += chipGroup("Time", [
      chip("Any time", { icon: "timer", action: "tonight-time", value: "0", pressed: ui.tonightMax === 0 }),
      chip("≤ 30 min", { action: "tonight-time", value: "30", pressed: ui.tonightMax === 30, label: "Up to 30 minutes" }),
      chip("≤ 45 min", { action: "tonight-time", value: "45", pressed: ui.tonightMax === 45, label: "Up to 45 minutes" }),
    ].join(""));
  }
  if (!picks.length) {
    const ai = sample && imagesOK;
    if (!state.recipes.length) body += emptyState(["grains", "dairy", "produce"], "No recipes yet", "Add a few recipes and Tonight will suggest what to cook from what you have.", [{ title: "Add sample recipes", action: "add-samples" }]);
    else if (!state.pantry.length) body += emptyState(["produce", "dairy", "seafood"], "Your fridge is empty", "Scan your last grocery receipt so Tonight knows what you have.", [ai ? { title: "Scan a receipt", action: "open-receipt", icon: "receipt" } : { title: "Add an item", action: "new-item" }]);
    else body += emptyState(["produce", "meat", "other"], "Nothing fits tonight", ui.tonightMax ? `No recipe under ${ui.tonightMax} minutes works with what you have. Try Any time, or ask the chef.` : "Every recipe needs more than 2 things you don't have. Ask the chef for ideas from what's in your fridge.",
      [...(skipped.size ? [{ title: "Show skipped recipes", action: "tonight-unskip" }] : []), { title: "Ask the chef", icon: "sparkles", action: "open-chef", value: CHEF_TONIGHT_PROMPT }]);
  }
  picks.forEach((p, i) => { body += (i === 0 && !entry) ? heroPick(p) : compactPick(p, i, picks.length); });

  body += `<button type="button" class="card chef-card" data-action="open-chef" data-value="${esc(CHEF_TONIGHT_PROMPT)}"><span class="avatar">${ic("sparkles")}</span><span class="grow vstack" style="gap:2px"><span class="t-tile-title">Nothing grabbing you?</span><span class="t-detail c-2">Ask the chef for something new with what's expiring.</span></span><span class="chev">${ic("right")}</span></button>`;
  body += `<p class="footnote">Picks favor food that's about to go bad, recipes you can make without shopping, and things you haven't had lately.</p>`;
  const chefBtn = `<button type="button" class="tb" data-action="open-chef" aria-label="Ask the chef"><span class="chef-cap">${ic("sparkles")}Chef</span></button>`;
  return navBar("Tonight", "", chefBtn) + `<div class="page">${body}</div>`;
}

function heroCategory(p) { return p.rescueItems.length ? itemCat(p.rescueItems[0]) : leadCategory(p.r, staples()); }
function pickActions(p, size) {
  const r = p.r, n = p.m.missing.length;
  return `<div class="actions">${btn("Cook this", { icon: "fork", action: "cook-tonight", id: r.id, label: `Cook ${r.title} tonight`, size })}${n ? confirmBtn(`add-missing:${r.id}`, `Add ${n} to list`, { kind: "secondary", icon: "basket", action: "add-missing", id: r.id, label: `Add ${n} missing ingredient${n === 1 ? "" : "s"} to shopping list`, size }) : ""}${quiet("Not tonight", { action: "tonight-skip", id: r.id, cls: "push", label: `Not tonight, hide ${r.title} for today` })}</div>`;
}
function heroPick(p) {
  const r = p.r, cat = heroCategory(p), sd = soonDays();
  const first = !ui.seenHero.has(r.id);
  ui.seenHero.add(r.id);
  const res = p.rescueItems.map(it => ({ it, st: expiryStatus(it.expiresAt, sd) }));
  const pop = first && !reducedMotion() ? "pop" : "";
  const stickers = res.slice(0, 3).map((x, i) => sticker(`${x.it.name} · ${shortLabel(x.st)}`, { tone: toneOf(x.st, x.it.location), rot: [-2, 1.5, -1][i], i, cls: pop, label: `Uses ${x.it.name.toLowerCase()}, ${spokenLabel(x.st, x.it.location).toLowerCase()}` })).join("")

      <span class="hero-top"><span class="vstack grow" style="gap:8px"><span class="t-eyebrow">Top pick</span><span class="t-hero">${esc(r.title)}</span></span>${timeSticker(p.total, pop)}</span>
      ${stickers ? `<span class="stickers">${stickers}</span>` : ""}
    </button>
    <div class="hero-body">
      <p class="reason">${reasonIcon}<span>${esc(p.reason)}</span></p>
      <div class="cov-line">${coverage(p.m)}${need ? `<span class="need clamp2">· ${esc(need)}</span>` : ""}${r.isFavorite ? `<span class="fav" role="img" aria-label="Favorite">${ic("heartFill")}</span>` : ""}</div>
      ${pickActions(p, "regular")}

function compactPick(p, i, count) {

function fridgeView() {
  const sd = soonDays();
  const q = ui.fridgeSearch.trim().toLowerCase();
  const nav = navBar("Fridge", tbIcon("gear", "open-settings", "Settings"), tbAdd("fridge-add", "Add"));
  if (!state.pantry.length) {
    const ai = sample && imagesOK;
    return nav + `<div class="page">${emptyState(["produce", "dairy", "seafood"], "Your fridge is empty", "Fill it in one go from your last grocery receipt, or add things as you unpack.",
      ai ? [{ step: "Scan your last grocery receipt", title: "Scan", action: "open-receipt" }, { step: "Or snap a photo of your groceries", title: "Photo", action: "open-scan" }, { step: "Or add items one at a time", title: "Add", action: "new-item" }]
        : [{ title: "Add an item", action: "new-item" }])}${ai ? "" : `<p class="footnote">Barcode, receipt and photo scanning are in the iPhone app. Receipt and photo scanning also work here when this page is opened in claude.ai.</p>`}</div>`;
  }
  const inLoc = state.pantry.filter(it => ui.fridgeFilter === "all" || it.location === ui.fridgeFilter);
  const items = inLoc.filter(it => !q || it.name.toLowerCase().includes(q));
  const stOf = it => expiryStatus(it.expiresAt, sd);
  const byUrgency = (a, b) => stOf(a).urgency - stOf(b).urgency || a.name.localeCompare(b.name);
  const detailLoc = it => [fmtQty(it.quantity, it.unit), cap(it.location)].filter(Boolean).join(" · ");
  const detailCat = it => [fmtQty(it.quantity, it.unit), CATEGORY_TITLE[itemCat(it)]].filter(Boolean).join(" · ");
  const row = (it, detail) => {
    const o = { name: it.name, detail, cat: itemCat(it), st: stOf(it), loc: it.location };
    return `<button type="button" class="frow btnrow li" data-action="edit-item" data-id="${esc(it.id)}" aria-label="${esc(foodLabel(o))}" aria-description="Edit">${foodRowInner(o)}</button>`;
  };
  const listCard = list => `<div class="card flush list">${list.join("")}</div>`;

  const counts = freshCounts(inLoc.map(it => ({ st: stOf(it), loc: it.location })));
  if (ui.toneFilter && !countFor(counts, ui.toneFilter)) ui.toneFilter = null;

  let body = searchField("fridge-search", "fridgeSearch", "Search items", ui.fridgeSearch);

  if (small) body += stockUp();
  const n = loc => state.pantry.filter(it => it.location === loc).length;
  body += chipGroup("Location", [chip("All", { count: state.pantry.length, action: "fridge-filter", value: "all", pressed: ui.fridgeFilter === "all" }),

  const queue = checkInQueue(state.pantry, sd);
  if (checkInDue() && queue.length) {
    const cats = queue.slice(0, 3).map(i => itemCat(state.pantry[i]));
    body += `<button type="button" class="card checkin-card" data-action="open-checkin" aria-label="Weekly check-in, ${plural(queue.length, "item")}, about 2 minutes">${fan(cats, true)}<span class="grow vstack" style="gap:2px"><span class="t-tile-title">Weekly <span style="white-space:nowrap">check-in</span></span><span class="t-detail c-2">${plural(queue.length, "item")} · <span style="white-space:nowrap">about 2&nbsp;minutes</span></span></span><span class="go" aria-hidden="true">Start</span></button>`;
  }

  if (!items.length) {

  return nav + `<div class="page">${body}</div>`;
}

function recipeTile({ r, m }) {

function recipeRow({ r, m }) {

function recipeDetailView(r) {

    `<button type="button" class="tb" data-action="toggle-fav" data-id="${esc(r.id)}" aria-label="${r.isFavorite ? "Unfavorite" : "Favorite"}" aria-pressed="${!!r.isFavorite}">${ic(r.isFavorite ? "heartFill" : "heart")}</button>${tbText("Edit", "edit-recipe", { attrs: `data-id="${esc(r.id)}"` })}`, { inline: true });

function planView() {

  const thisWeek = ui.weekStart === weekStartOf(today);
  const s0 = fromISO(ui.weekStart), s6 = fromISO(addDays(ui.weekStart, 6));

  const title = s0.getMonth() === s6.getMonth() ? `${mon(s0)} ${s0.getDate()} – ${s6.getDate()}` : `${mon(s0)} ${s0.getDate()} – ${mon(s6)} ${s6.getDate()}`;
  const n = weekEntries.length;
  const nav = navBar("Meal plan",
    thisWeek ? "" : tbText("Today", "week-today"),
    tbIcon("basketLine", "shop-week", "Shop for week", { disabled: !n }));
  const bySlot = (a, b) => SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot);
  const firstRescue = e => { const r = recipeById(e.recipeId); const res = r ? rescueFor(r) : []; return res[0] || null; };
  let body = `<div class="week-head"><button type="button" class="tb" data-action="week" data-value="-1" aria-label="Previous week">${ic("left")}</button><div class="mid"><div class="t-tile-title">${esc(title)}</div><div class="t-footnote c-2">${n ? plural(n, "meal") + " planned" : "Nothing planned"}</div></div><button type="button" class="tb" data-action="week" data-value="1" aria-label="Next week">${ic("right")}</button></div>`;
  body += `<div class="week-strip">${days.map(d => {

    const dd = fromISO(d);
    const label = `${dd.toLocaleDateString(undefined, { weekday: "long" })} ${dd.getDate()}, ${entries.length ? plural(entries.length, "meal") : "no meals"}${rescues.some(Boolean) ? ", uses expiring food" : ""}`;

  }).join("")}</div>`;
  if (n) {
    body += `<section class="shop-card"><div class="hstack"><span class="beet-tile" aria-hidden="true">${ic("basket")}</span><div class="vstack grow" style="gap:2px"><h2 class="t-tile-title" style="color:var(--beet-strong)">Shop for this week</h2><p class="t-detail c-2">Adds what ${plural(n, "meal")} need${n === 1 ? "s" : ""}, minus what you have</p></div></div><div>${confirmBtn("shop-week", "Add to list", { kind: "primary", size: "compact", icon: "basket", action: "shop-week", label: "Add this week's shopping to your list" })}</div></section>`;

    } else {
      body += `<div class="card flush list">${entries.map(e => {
        const r = recipeById(e.recipeId);
        const cat = r ? leadCategory(r, staples()) : "other";
        const t = r ? r.title : "Removed recipe";
        return `<div class="meal li"><button type="button" class="meal-main" data-action="open-recipe" data-id="${r ? esc(r.id) : ""}" ${r ? "" : "disabled"}>${tile(cat)}<span class="vstack" style="gap:3px;min-width:0"><span class="t-eyebrow">${esc(e.slot)}</span><span class="t-row-title clamp2">${esc(t)}</span></span><span class="x" aria-label="${plural(e.servings, "serving")}">×${e.servings}</span></button>${quiet("Remove", { action: "remove-entry", id: e.id, label: `Remove ${t} from ${weekday}` })}</div>`;
      }).join("")}<button type="button" class="add-row li" data-action="add-meal" data-day="${d}" aria-label="Add another meal on ${esc(weekday)}">${ic("plus")}Add</button></div>`;
    }
  }
  return nav + `<div class="page">${body}</div>`;
}

  if (ui.chatError) body += `<div class="err-card" role="alert">${ic("alertFill")}<span class="grow">${esc(ui.chatError)}</span>${ui.chatDraft.trim() && !ui.chatBusy ? `<button type="button" class="quiet" style="--q:var(--today-text);min-height:24px;padding:0" data-action="chat-retry">Try again</button>` : ""}</div>`;
  body += "</div>";
  return navBar("Chef", back, ui.chat.length && !ui.chatBusy ? tbText("New chat", "new-chat") : "") + `<div class="page">${body}</div>`;
}

function composer() {

const TABS = [["tonight", "Tonight", "fork", "forkFill"], ["fridge", "Fridge", "fridge", "fridgeFill"], ["recipes", "Recipes", "book", "bookFill"], ["plan", "Plan", "calendar", "calendarFill"], ["shopping", "Shopping", "basketLine", "basket"]];

let justToggled = null;  // selector of the control whose check mark should animate after this render
function render() {
  const active = document.activeElement;
  const focusId = active && active.id, selStart = active && active.selectionStart, selEnd = active && active.selectionEnd;
  const app = document.getElementById("app");
  const view = { tonight: tonightView, fridge: fridgeView, recipes: recipesView, plan: planView, shopping: shoppingView, chef: chefView }[ui.tab]();
  app.innerHTML = view + composer();
  app.classList.toggle("has-bar", view.includes('class="pagebar"') || (ui.tab === "chef" && !!sample));
  const sd = soonDays();
  const nowCount = state.pantry.filter(p => { const s = expiryStatus(p.expiresAt, sd); return s.kind === "soon" && s.days <= 1; }).length;
  document.getElementById("tabbar").innerHTML = TABS.map(([id, label, icon, iconOn]) => {
    const on = ui.tab === id;
    const badge = id === "fridge" && nowCount ? `<span class="badge" aria-hidden="true">${nowCount}</span>` : "";
    return `<button type="button" class="tab" data-action="tab" data-value="${id}" ${on ? 'aria-current="page"' : ""} ${badge ? `aria-label="${label}, ${nowCount} to use by tomorrow"` : ""}><span class="ico">${ic(on ? iconOn : icon)}${badge}</span><span>${label}</span></button>`;
  }).join("");
  if (justToggled) {
    const el = app.querySelector(justToggled);
    if (el) el.classList.add("just");
    justToggled = null;
  }
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el.closest("#app")) {
      el.focus();
      try { if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text input */ }
    }
  }
}

// ---------- Sheets ----------
let lastSheet = null;
function openSheet(sheet) { ui.sheet = sheet; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }
function sheetFrame(title, body, o = {}) {
  const left = o.left !== undefined ? o.left : tbText("Cancel", "close-sheet");
  return `<div class="sheet-wrap"><div class="sheet-backdrop" data-action="close-sheet"></div><div class="sheet ${o.cls || ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><div class="left">${left}</div><h2>${esc(title)}</h2><div class="right">${o.right || ""}</div></div><div class="sheet-body">${body}</div>${o.bar ? `<div class="sheet-bar">${o.bar}</div>` : ""}${o.dialog || ""}</div></div>`;
}
function renderSheet() {
  const root = document.getElementById("sheet-root");
  const s = ui.sheet;
  if (!s) { root.innerHTML = ""; lastSheet = null; return; }
  const same = lastSheet === s;
  const prev = root.querySelector(".sheet-body");
  const scroll = same && prev ? prev.scrollTop : 0;
  root.innerHTML = ({ menu: menuSheet, item: itemSheet, scan: scanSheet, receipt: receiptSheet, cook: cookSheet, checkin: checkInSheet, recipe: recipeSheet, import: importSheet, plan: planSheet, pick: pickSheet, settings: settingsSheet, confirm: confirmSheet })[s.type](s);
  if (same && root.firstElementChild) root.firstElementChild.classList.add("still");
  lastSheet = s;
  const body = root.querySelector(".sheet-body");
  if (body && scroll) body.scrollTop = scroll;
  s.enter = false;
  if (justToggled) { const el = root.querySelector(justToggled); if (el) el.classList.add("just"); justToggled = null; }
  const first = root.querySelector("[autofocus]");
  if (first && !same) first.focus();
}

function menuSheet(s) {
  const groups = [[]];
  for (const m of s.items) { if (m.divider) groups.push([]); else groups[groups.length - 1].push(m); }
  const row = m => `<button type="button" class="menu-row li ${m.danger ? "danger" : ""}" data-action="${m.action}" ${m.disabled ? "disabled" : ""}><span class="mt" aria-hidden="true">${ic(m.icon)}</span><span class="grow vstack" style="gap:2px"><span class="t-row-title">${esc(m.label)}</span>${m.note ? `<span class="t-detail c-2">${esc(m.note)}</span>` : ""}</span></button>`;
  const cards = groups.filter(g => g.length).map(g => `<div class="card flush list" style="--inset:57px">${g.map(row).join("")}</div>`).join("");
  return sheetFrame(s.title, cards + (s.footnote ? `<p class="footnote">${esc(s.footnote)}</p>` : ""));
}

function expLive(iso, loc) {

function itemSheet(s) {

    <div class="label-sm">Category</div>

    <div class="label-sm">Expires</div>
    <div class="card flush">
      <label class="field" for="f-hasexp" style="cursor:pointer"><span class="grow">Has an expiration date</span><input id="f-hasexp" class="switch" type="checkbox" ${hasExp ? "checked" : ""} data-action-change="toggle-exp"></label>

    ${it ? `<div class="card flush list" style="--inset:16px"><button type="button" class="plain-row li" data-action="used-up" data-id="${esc(it.id)}">${ic("basket")}Used up: add to shopping list</button><button type="button" class="plain-row li danger" data-action="delete-item" data-id="${esc(it.id)}">${ic("trash")}Delete item</button></div>` : ""}

const valOf = id => { const el = document.getElementById(id); return el ? el.value : ""; };
function refreshItemSheet() {
  if (!document.getElementById("item-form")) return;
