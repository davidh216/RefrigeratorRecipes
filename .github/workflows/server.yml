# Tests the Claude proxy in server/ and deploys it to Cloudflare Workers.
# Deploys on pushes that change server/ (once the secrets below exist), or from
# Actions → Server → Run workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID    Shown on the right of the Workers & Pages overview
#   ANTHROPIC_API_KEY        The key the server spends; console.anthropic.com → API keys.
#                            Optional: without it the server deploys but answers "AI isn't switched on yet".
#   FRIDGE_APP_TOKEN         Any long random string; the TestFlight build embeds the same one
#   FRIDGE_APP_TOKEN_OLD     Optional: a previous token still accepted while rotating
#   FRIDGE_ADMIN_TOKEN       Optional: password for the usage page at /admin
#   FRIDGE_CONTACT_EMAIL     Optional: contact address shown on the privacy policy at /privacy
#   APPLE_TEAM_ID            Already set for TestFlight; App Attest checks requests come from your app
# See server/README.md.
name: Server

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
      # The content tests check server editions against the app's own editions and recipes.
      - "ios/RefrigeratorRecipes/Resources/SuperIngredients.json"
      - "ios/RefrigeratorRecipes/Resources/SampleRecipes.json"

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run check
          npm test

      - name: Check the pinned Apple App Attest root certificate
        # src/appattest.ts pins Apple's root; make sure it's byte-for-byte what Apple publishes.
        run: |
          curl -sSf https://www.apple.com/certificateauthority/Apple_App_Attestation_Root_CA.pem -o "$RUNNER_TEMP/apple.pem"
          APPLE=$(grep -v CERTIFICATE "$RUNNER_TEMP/apple.pem" | tr -d '\r\n')
          PINNED=$(grep -A1 'APPLE_ROOT_CA_BASE64 =' src/appattest.ts | tail -1 | tr -d ' ";')
          if [ "$APPLE" != "$PINNED" ]; then echo "::error::The pinned App Attest root differs from Apple's"; exit 1; fi
          echo "Pinned App Attest root matches apple.com"

      - name: Check secrets
        id: secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRIDGE_APP_TOKEN: ${{ secrets.FRIDGE_APP_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$FRIDGE_APP_TOKEN" ] || missing="$missing FRIDGE_APP_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice::Not deploying: missing repository secrets:$missing (see server/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            [ -n "$ANTHROPIC_API_KEY" ] || echo "::notice::No ANTHROPIC_API_KEY yet: deploying, but AI requests will say AI isn't switched on."
          fi

      - name: Find or create the quota store
        if: steps.secrets.outputs.ready == 'true'
        run: |
          find_id() {
            npx wrangler kv namespace list 2>/dev/null \
              | jq -r '.[] | select(.title == "fridge-quota" or (.title | endswith("-fridge-quota"))) | .id' | head -1
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create fridge-quota
            ID=$(find_id)
          fi
          [ -n "$ID" ] || { echo "::error::Couldn't create the fridge-quota KV namespace"; exit 1; }
          sed -i "s/KV_NAMESPACE_ID/$ID/" wrangler.toml

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRIDGE_APP_TOKEN: ${{ secrets.FRIDGE_APP_TOKEN }}
          FRIDGE_APP_TOKEN_OLD: ${{ secrets.FRIDGE_APP_TOKEN_OLD }}
          FRIDGE_ADMIN_TOKEN: ${{ secrets.FRIDGE_ADMIN_TOKEN }}
          FRIDGE_CONTACT_EMAIL: ${{ secrets.FRIDGE_CONTACT_EMAIL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          TOKENS="$FRIDGE_APP_TOKEN"
          [ -z "$FRIDGE_APP_TOKEN_OLD" ] || TOKENS="$TOKENS,$FRIDGE_APP_TOKEN_OLD"
          # Secrets are additive: an empty optional value is left out, keeping whatever the Worker has.
          jq -n --arg key "$ANTHROPIC_API_KEY" --arg token "$TOKENS" \
                --arg admin "$FRIDGE_ADMIN_TOKEN" --arg contact "$FRIDGE_CONTACT_EMAIL" --arg team "$APPLE_TEAM_ID" \
            '{APP_TOKEN: $token}
             + (if $key == "" then {} else {ANTHROPIC_API_KEY: $key} end)
             + (if $admin == "" then {} else {ADMIN_TOKEN: $admin} end)
             + (if $contact == "" then {} else {CONTACT_EMAIL: $contact} end)
             + (if $team == "" then {} else {APPLE_TEAM_ID: $team} end)' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/secrets.json"
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "### Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Privacy policy: $URL/privacy · Usage: $URL/admin" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository secret FRIDGE_PROXY_URL to this URL so TestFlight builds use it." >> "$GITHUB_STEP_SUMMARY"

      - name: Check it answers
        if: steps.secrets.outputs.ready == 'true'
        env:
          FRIDGE_APP_TOKEN: ${{ secrets.FRIDGE_APP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          [ -n "$URL" ] || exit 0
          sleep 5
          curl -sf "$URL/v1/quota" -H "x-fridge-token: $FRIDGE_APP_TOKEN" \
            -H "x-fridge-install: github-actions-health-check" && echo
          # With a key, make one tiny request on the light model to prove Claude answers.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            STATUS=$(curl -s -o "$RUNNER_TEMP/reply.json" -w "%{http_code}" "$URL/v1/messages" \
              -H "x-fridge-token: $FRIDGE_APP_TOKEN" -H "x-fridge-install: github-actions-health-check" \
              -H "content-type: application/json" \
              -d '{"model":"claude-haiku-4-5","max_tokens":16,"messages":[{"role":"user","content":"Reply with the single word OK."}]}')
            echo "Claude via the server: HTTP $STATUS"
            jq -r '(.content // [] | map(select(.type=="text").text) | join("")), (.error.message // empty)' "$RUNNER_TEMP/reply.json"
            [ "$STATUS" = 200 ] || { echo "::error::The server couldn't reach Claude (HTTP $STATUS)"; exit 1; }
          else
            echo "::notice::No ANTHROPIC_API_KEY yet, so AI requests will say AI isn't switched on."
          fi
