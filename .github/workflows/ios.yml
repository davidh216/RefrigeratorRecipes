name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      # FridgeCore's library test also checks the server's recipe packs and menus.
      - "server/content/recipe-packs.json"
      - "server/content/menus.json"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      # FridgeCore's library test also checks the server's recipe packs and menus.
      - "server/content/recipe-packs.json"
      - "server/content/menus.json"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        # App Store Connect only accepts builds made with the iOS 26 SDK or later.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Test FridgeCore
        run: swift test --package-path ios/Packages/FridgeCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app (simulator, unsigned)
        run: |
          cd ios
          xcodebuild build \
            -project RefrigeratorRecipes.xcodeproj \
            -scheme RefrigeratorRecipes \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # Lists strings with no Spanish yet (the app falls back to English for them). Informational.
      - name: Strings missing Spanish
        continue-on-error: true
        run: |
          cd ios
          xcodebuild -exportLocalizations \
            -project RefrigeratorRecipes.xcodeproj \
            -localizationPath build/loc \
            -exportLanguage es \
            CODE_SIGNING_ALLOWED=NO > build/export.log 2>&1 || { tail -40 build/export.log; exit 1; }
          python3 tools/missing_translations.py build/loc/es.xcloc
