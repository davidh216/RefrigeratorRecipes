# Archives the iOS app and uploads it to TestFlight. Runs from the Actions tab
# ("TestFlight" → Run workflow, once this file is on the default branch) or on any
# push whose commit message starts with [testflight].
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  10-character Team ID (developer.apple.com → Membership)
#   APP_STORE_CONNECT_KEY_ID       Key ID of an App Store Connect API key with the Admin role
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY_P8       The downloaded AuthKey_XXXX.p8, base64-encoded
# Optional, so testers get AI features without their own key (see server/README.md):
#   FRIDGE_PROXY_URL               https://fridge-claude.<you>.workers.dev
#   FRIDGE_APP_TOKEN               Same value the Server workflow deploys
# See ios/README.md → "Automatic TestFlight uploads".
name: TestFlight

on:
  workflow_dispatch:
  push:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      PROXY_URL: ${{ secrets.FRIDGE_PROXY_URL }}
      APP_TOKEN: ${{ secrets.FRIDGE_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "${{ secrets.APP_STORE_CONNECT_KEY_P8 }}" ] || missing="$missing APP_STORE_CONNECT_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          if [ -z "$PROXY_URL" ] || [ -z "$APP_TOKEN" ]; then
            echo "::warning::FRIDGE_PROXY_URL / FRIDGE_APP_TOKEN not set: testers will need their own Claude key."
          fi

      - name: Select Xcode 26
        # App Store Connect only accepts builds made with the iOS 26 SDK or later.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Clear old CI signing certificates
        # Every run signs on a fresh machine, so Xcode makes a new "Apple Development:
        # Created via API" certificate each time, and Apple caps how many can exist.
        # Revoke the ones earlier runs made; certificates made in Xcode on a Mac are kept.
        # Best-effort: a failure here never blocks the build.
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc/bin/python" - <<'PY'
          import json, os, time, urllib.error, urllib.request
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey.p8")).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req) as res:
                  body = res.read()
                  return json.loads(body) if body else None
          base = "https://api.appstoreconnect.apple.com/v1/certificates"
          certs = call("GET", base + "?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT&limit=200")["data"]
          for cert in certs:
              a = cert["attributes"]
              label = (a.get("name") or "") + " " + (a.get("displayName") or "")
              if "Created via API" not in label:
                  print("Kept", label.strip())
                  continue
              try:
                  call("DELETE", base + "/" + cert["id"])
                  print("Revoked", label.strip(), a.get("expirationDate"))
              except urllib.error.HTTPError as err:
                  # e.g. 403 for a certificate another key or service created; leave it alone.
                  print("Couldn't revoke", label.strip(), err.code, err.read().decode()[:300])
          PY

      - name: Test FridgeCore
        run: swift test --package-path ios/Packages/FridgeCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Archive
        run: |
          cd ios
          # Build numbers must go up with every upload; +100 leaves room for manual uploads.
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          xcodebuild archive \
            -project RefrigeratorRecipes.xcodeproj \
            -scheme RefrigeratorRecipes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RefrigeratorRecipes.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            FRIDGE_PROXY_URL="$PROXY_URL" \
            FRIDGE_APP_TOKEN="$APP_TOKEN" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*[Pp]rovision|Signing|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }
          echo "Archived build $BUILD_NUMBER"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RefrigeratorRecipes.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
